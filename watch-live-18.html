<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frame Perdido — Reproductor</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    
    <style>
        /* ============================================================ */
        /* VARIABLES Y RESET                                            */
        /* ============================================================ */
        :root {
            --bg: #0a0a0f;
            --bg-card: #12121a;
            --bg-elevated: #1a1a25;
            --text: #e8e8f0;
            --text-muted: #8a8a9a;
            --text-dim: #5a5a6a;
            --accent: #ff6b35;
            --accent-soft: #ff6b3520;
            --accent-glow: #ff6b3560;
            --border: #2a2a3a;
            --border-hover: #3a3a50;
            --plyr-color-main: #ff6b35;
            --plyr-video-control-color: #e8e8f0;
            --plyr-video-control-color-hover: #ffffff;
            --plyr-video-control-background-hover: rgba(255,107,53,0.2);
            --plyr-range-fill-background: #ff6b35;
            --plyr-range-thumb-background: #ff6b35;
            --plyr-range-thumb-shadow: 0 0 10px rgba(255,107,53,0.5);
            --plyr-menu-background: #12121a;
            --plyr-menu-color: #e8e8f0;
            --plyr-tooltip-background: #1a1a25;
            --plyr-tooltip-color: #e8e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-page {
            max-width: 1100px;
            width: 100%;
        }

        /* ============================================================ */
        /* BANNERS - RESPONSIVE                                         */
        /* ============================================================ */
        .adsterra-mobile { display: none; }
        .adsterra-desktop { display: block; }

        @media only screen and (max-width: 768px) {
            .adsterra-mobile { display: block; }
            .adsterra-desktop { display: none; }
        }

        /* ============================================================ */
        /* OCULTAR BANNER NATIVE EN MÓVIL (EL DE ABAJO)                */
        /* ============================================================ */
        @media only screen and (max-width: 768px) {
            div[style*="margin: 20px auto; max-width: 100%;"] {
                display: none !important;
            }
        }

        /* ============================================================ */
        /* RESTO DE ESTILOS                                             */
        /* ============================================================ */
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .video-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .video-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: opacity 0.3s;
        }
        .back-btn:hover { opacity: 0.7; }

        .plyr-container {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .plyr--video {
            border-radius: 16px;
        }
        .plyr--video .plyr__controls {
            padding: 16px 20px;
        }
        .plyr--fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
        }

        .episode-selector {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 16px 0;
        }
        .episode-btn {
            padding: 5px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .episode-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .episode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .version-separator {
            color: var(--text-muted);
            padding: 0 10px;
            font-size: 0.9rem;
            opacity: 0.4;
            user-select: none;
        }

        .version-group {
            margin: 4px 0;
            width: 100%;
        }

        .version-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            width: 100%;
            text-align: left;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .version-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .version-btn .count {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.75rem;
            margin-left: auto;
        }

        .episode-list {
            display: none;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 0 8px 16px;
            border-left: 2px solid var(--border);
            margin: 4px 0 8px 8px;
        }

        .episode-list.open {
            display: flex;
        }

        @media (max-width: 480px) {
            .episode-list .episode-btn {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            .version-btn {
                font-size: 0.8rem;
                padding: 8px 12px;
            }
        }

        .expediente-info {
            margin-top: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        .expediente-info h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .expediente-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .expediente-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .exp-tag {
            background: #1a1a25;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
        }

        .error-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 480px;
            margin: 0 auto;
        }
        .error-box h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }
        .error-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .error-box .id-received {
            display: inline-block;
            background: #1a1a25;
            border: 1px solid var(--border);
            color: #5a5a6a;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'Space Grotesk', monospace;
            margin: 12px 0;
        }

        @media (max-width: 768px) {
            .video-title { font-size: 1.1rem; }
            body { padding: 10px; }
            .plyr-container { border-radius: 12px; }
            .expediente-info { padding: 16px; }
        }
        @media (orientation: portrait) {
            .plyr--fullscreen video {
                transform: rotate(0deg) !important;
            }
        }
    </style>
</head>
<body>

        <!-- ============================================================ -->

        <div style="margin: 20px auto; max-width: 100%;">
            <script async="async" data-cfasync="false" src="https://dischargeconceiteffort.com/9194bf40864159e5a4b3f23a7e69a1b6/invoke.js"></script>
            <div id="container-9194bf40864159e5a4b3f23a7e69a1b6"></div>

        <!-- ============================================================ -->
        <!-- SELECTOR DE EPISODIOS (dinámico)                             -->
        <!-- ============================================================ -->
        <div class="episode-selector" id="episodeSelector"></div>

        <!-- ============================================================ -->
        <!-- INFO DEL EXPEDIENTE (dinámico)                                -->
        <!-- ============================================================ -->
        <div class="expediente-info" id="expedienteInfo">
            <h3>📁 Sobre este expediente</h3>
            <p id="expedienteDesc">Cargando...</p>
            <div class="expediente-tags" id="expedienteTags"></div>
        </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // ============================================================
        // BASE DE DATOS DE VIDEOS - LIVE ACTION + ADULTOS
        // IDs: Live Action (1000-1999) | Adultos (2000-2999)
        // ============================================================
        const videos = {
            // ============================================================
            // LIVE ACTION (IDs 1000-1999)
            // ============================================================
            1000: {
                title: "Riki-Oh: The Story of Ricky",
                year: 1991,
                studio: "Golden Sun Films",
                director: "Lam Nai-choi",
                desc: "Ricky Ho es un joven con fuerza sobrehumana que es encarcelado en una prisión privada en una sociedad distópica. Allí se enfrenta a guardias sádicos y otros reclusos mientras busca la manera de escapar y hacer justicia.",
                tags: ["Live Action", "Acción", "Artes marciales", "Gore", "Culto"],
                episodios: [
            { num: 1, version: "Dob", url: "//ok.ru/videoembed/10465970686515?nochat=1" }
                ]
            }
            
        };

        // ============================================================
        // LEER PARÁMETROS DE LA URL
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));
        const ep = parseInt(params.get('ep')) || 1;
        const version = params.get('version') || null;

        // ============================================================
        // FUNCIONES
        // ============================================================
        function esVideoMega(url) {
            return url && url.includes('mega.nz/embed');
        }

        function esVideoYouTube(url) {
            return url && (url.includes('youtube.com/embed') || url.includes('youtu.be'));
        }

        function obtenerUrlClean(url) {
            if (!url) return '';
            if (esVideoMega(url)) return url;
            if (esVideoYouTube(url)) {
                let cleanUrl = url;
                if (url.includes('?')) cleanUrl = url.split('?')[0];
                return cleanUrl + '?rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&origin=' + encodeURIComponent(window.location.origin);
            }
            return url;
        }

        function cambiarEpisodio(id, num, version) {
            let url = `watch-live-18.html?id=${id}&ep=${num}`;
            if (version) url += `&version=${version}`;
            window.location.href = url;
        }

        // ============================================================
        // AGRUPAR EPISODIOS POR VERSIÓN
        // ============================================================
        function agruparEpisodios(episodios) {
            const grupos = {};
            episodios.forEach(ep => {
                const version = ep.version || "Episodio";
                if (!grupos[version]) {
                    grupos[version] = [];
                }
                grupos[version].push(ep);
            });
            return grupos;
        }

        function renderizarSelector(episodios, id) {
            const grupos = agruparEpisodios(episodios);
            const versiones = Object.keys(grupos);
            
            if (versiones.length === 1 && versiones[0] === "Episodio") {
                return episodios.map(ep => {
                    const label = `Ep. ${ep.num}`;
                    return `<button class="episode-btn" onclick="cambiarEpisodio(${id}, ${ep.num}, '${ep.version || ''}')">${label}</button>`;
                }).join('');
            }
            
            let html = '';
            versiones.forEach(version => {
                const eps = grupos[version];
                const count = eps.length;
                const groupId = 'group-' + id + '-' + version.replace(/\s/g, '-');
                
                html += `
                    <div class="version-group">
                        <button class="version-btn" onclick="toggleVersion('${groupId}')">
                            📁 ${version}
                            <span class="count">${count} episodio${count > 1 ? 's' : ''}</span>
                        </button>
                        <div class="episode-list" id="${groupId}">
                            ${eps.map(ep => {
                                const label = `Ep. ${ep.num}`;
                                return `<button class="episode-btn" onclick="cambiarEpisodio(${id}, ${ep.num}, '${ep.version || ''}')">${label}</button>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function toggleVersion(groupId) {
            const list = document.getElementById(groupId);
            const btn = list.previousElementSibling;
            if (list.classList.contains('open')) {
                list.classList.remove('open');
                btn.innerHTML = btn.innerHTML.replace('📂', '📁');
            } else {
                list.classList.add('open');
                btn.innerHTML = btn.innerHTML.replace('📁', '📂');
            }
        }

        // ============================================================
        // CARGAR CONTENIDO
        // ============================================================
        if (id && videos[id]) {
            const v = videos[id];
            const episodios = v.episodios;

            let episodioActual = null;
            if (episodios && episodios.length > 0) {
                episodioActual = episodios.find(e => e.num === ep && (version ? e.version === version : true));
                if (!episodioActual) episodioActual = episodios[0];
            }

            let titleSuffix = '';
            if (episodioActual) {
                if (episodioActual.version && episodioActual.version !== "Episodio") {
                    titleSuffix = ` — ${episodioActual.version} ${episodioActual.num}`;
                } else if (episodios.length > 1) {
                    titleSuffix = ` — Episodio ${episodioActual.num}`;
                }
            }
            document.getElementById('videoTitle').textContent = v.title + titleSuffix;
            document.getElementById('videoMeta').textContent = `${v.year} · ${v.studio} · ${v.director}`;
            document.title = v.title + titleSuffix + " — Frame Perdido";

            if (episodioActual && episodioActual.url) {
                const cleanUrl = obtenerUrlClean(episodioActual.url);
                document.getElementById('videoFrame').src = cleanUrl;
            } else {
                document.getElementById('videoFrame').src = '';
                document.getElementById('videoFrame').style.display = 'none';
                const playerContainer = document.querySelector('.plyr-container');
                const noVideoMsg = document.createElement('div');
                noVideoMsg.style.cssText = 'padding: 60px 20px; text-align: center; color: var(--text-muted); background: var(--bg-card); border-radius: 16px;';
                noVideoMsg.innerHTML = `
                    <h3 style="font-family: 'Space Grotesk', sans-serif; color: var(--text); margin-bottom: 12px;">🎬 No hay video disponible</h3>
                    <p style="font-size: 0.9rem;">Este expediente aún no tiene video en nuestro archivo.</p>
                `;
                playerContainer.appendChild(noVideoMsg);
            }

            if (episodios && episodios.length > 0) {
                document.getElementById('episodeSelector').innerHTML = renderizarSelector(episodios, id);
            } else {
                document.getElementById('episodeSelector').innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">No hay episodios disponibles para este título.</p>`;
            }

            document.getElementById('expedienteDesc').textContent = v.desc;
            document.getElementById('expedienteTags').innerHTML = v.tags.map(t => `<span class="exp-tag">${t}</span>`).join('');

            if (document.getElementById('player') && episodioActual && episodioActual.url) {
                const player = new Plyr('#player', {
                    youtube: { noCookie: false, rel: 0, modestbranding: 1, iv_load_policy: 3 },
                    tooltips: { controls: true, seek: true },
                    keyboard: { focused: true, global: true },
                    fullscreen: { enabled: true, fallback: true, iosNative: true },
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
                    settings: ['captions', 'quality', 'speed'],
                    quality: { default: 720, options: [1080, 720, 480, 360] }
                });
            }

        } else {
            document.getElementById('videoTitle').textContent = 'Contenido no disponible';
            document.getElementById('videoMeta').textContent = '';
            document.getElementById('episodeSelector').innerHTML = '';
            document.getElementById('expedienteDesc').textContent = 'Este expediente no existe en nuestro archivo o no tiene video asociado.';
            document.getElementById('expedienteTags').innerHTML = `<span class="exp-tag">ID: ${id || 'ninguno'}</span>`;
            document.title = "No disponible — Frame Perdido";
            
            const playerContainer = document.querySelector('.plyr-container');
            const errorMsg = document.createElement('div');
            errorMsg.style.cssText = 'padding: 60px 20px; text-align: center; color: var(--text-muted); background: var(--bg-card); border-radius: 16px;';
            errorMsg.innerHTML = `
                <h3 style="font-family: 'Space Grotesk', sans-serif; color: var(--text); margin-bottom: 12px;">⚠️ Expediente no encontrado</h3>
                <p style="font-size: 0.9rem;">El ID <strong>${id || 'ninguno'}</strong> no corresponde a ningún título en nuestro archivo.</p>
                <a href="index.html" style="display: inline-block; margin-top: 16px; color: var(--accent); text-decoration: none; font-weight: 500;">← Volver al archivo</a>
            `;
            playerContainer.appendChild(errorMsg);
        }
    </script>

</body>
