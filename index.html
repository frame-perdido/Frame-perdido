<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09080d">
<meta name="description" content="FRAME PLUS. Próximamente.">
<title>FRAME PLUS — Próximamente</title>
<style>
:root{color-scheme:dark;--bg:#09080d;--violet:#9b5cff;--red:#ff563f;--text:#f7f4fb;--muted:#aaa4b5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;color:var(--text);background:radial-gradient(ellipse at 18% 18%,rgba(126,65,220,.17),transparent 38%),radial-gradient(ellipse at 85% 82%,rgba(255,75,55,.10),transparent 34%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse at center,black,transparent 78%)}
.wrap{position:relative;width:min(900px,100%);padding:48px 24px;text-align:center}
.mark{width:68px;height:68px;margin:0 auto 30px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);border-radius:19px;background:linear-gradient(145deg,rgba(155,92,255,.18),rgba(255,86,63,.10));box-shadow:0 0 55px rgba(137,76,255,.15),inset 0 1px rgba(255,255,255,.12);font-size:30px;font-weight:900;letter-spacing:-4px}
.mark span,h1 .plus{background:linear-gradient(120deg,#c69aff 12%,#9250ff 56%,#ff6948 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark span{transform:translateX(-2px)}
h1{margin:0;font-size:clamp(3.1rem,10vw,7.4rem);line-height:.95;letter-spacing:-.085em;font-weight:900}
h1 .plus{display:inline-block;margin-left:.035em}
.rule{width:58px;height:3px;margin:34px auto 27px;border-radius:8px;background:linear-gradient(90deg,var(--violet),var(--red));box-shadow:0 0 20px rgba(155,92,255,.45)}
.eyebrow{margin:0 0 12px;color:#c5a7ff;font-size:.76rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
.message{margin:0;font-size:clamp(1.2rem,3vw,1.75rem);font-weight:650;letter-spacing:-.035em}
.sub{margin:14px 0 0;color:var(--muted);font-size:.96rem;letter-spacing:.015em}
.bottom{position:fixed;bottom:24px;left:20px;right:20px;color:#777180;text-align:center;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase}
@media(max-width:480px){.wrap{padding:36px 20px}.mark{width:58px;height:58px;border-radius:16px;margin-bottom:26px}.sub{max-width:270px;margin-inline:auto;line-height:1.6}}
@media(prefers-reduced-motion:no-preference){.wrap{animation:appear .9s ease both}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<main class="wrap">
<div class="mark" aria-hidden="true"><span>F+</span></div>
<p class="eyebrow">Una nueva experiencia</p>
<h1>FRAME<span class="plus">+</span></h1>
<div class="rule"></div>
<p class="message">Próximamente, una app.</p>
<p class="sub">Prepárate para descubrir algo diferente.</p>
</main>
<footer class="bottom">FRAME PLUS · Próximamente</footer>
</body>
</html>
