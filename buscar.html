<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar en Danimados — Frame Perdido</title><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #0a0a0f;
        --bg-card: #12121a;
        --bg-elevated: #1a1a25;
        --text: #e8e8f0;
        --text-muted: #8a8a9a;
        --text-dim: #5a5a6a;
        --accent: #d4a373;
        --accent-soft: #d4a37320;
        --border: #2a2420;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }

    .back {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 1.2rem;
    }

    h1 {
        font-family: 'Space Mono', monospace;
        font-size: 1.4rem;
    }

    h1 span {
        color: var(--accent);
    }

    .search-box {
        position: relative;
        margin-bottom: 30px;
    }

    .search-box input {
        width: 100%;
        padding: 16px 20px 16px 50px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 1rem;
        font-family: 'Space Mono', monospace;
        outline: none;
    }

    .search-box input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
    }

    .estado {
        text-align: center;
        padding: 30px;
        color: var(--text-muted);
        font-family: 'Space Mono', monospace;
        font-size: 0.85rem;
    }

    .ficha {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
        display: none;
    }

    .ficha.activa {
        display: block;
    }

    .ficha-header {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .ficha-img {
        width: 150px;
        border-radius: 8px;
        border: 1px solid var(--border);
    }

    .ficha-info {
        flex: 1;
        min-width: 200px;
    }

    .ficha-info h2 {
        font-family: 'Space Mono', monospace;
        font-size: 1.3rem;
        margin-bottom: 8px;
    }

    .meta {
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-bottom: 12px;
    }

    .meta span {
        margin-right: 12px;
    }

    .sinopsis {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.7;
    }

    .seccion {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .seccion h3 {
        font-family: 'Space Mono', monospace;
        font-size: 0.9rem;
        color: var(--accent);
        margin-bottom: 12px;
    }

    .lista-botones {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .btn-servidor {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-family: 'Space Mono', monospace;
        font-size: 0.8rem;
        text-decoration: none;
        display: inline-block;
        transition: all 0.2s;
    }

    .btn-servidor:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .btn-servidor.activo {
        background: var(--accent);
        color: #0a0a0f;
        border-color: var(--accent);
    }

    #seccionPlayer {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        display: none;
    }

    #seccionPlayer.activa {
        display: block;
    }

    .player-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
    }

    .player-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }

    .player-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
        align-items: center;
    }

    .player-info {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: 'Space Mono', monospace;
        flex: 1;
    }

    .episodios-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 200px;
        overflow-y: auto;
        padding: 8px 0;
    }

    .ep-btn {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.75rem;
        font-family: 'Space Mono', monospace;
    }

    .ep-btn:hover,
    .ep-btn.activo {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
    }

    .resultados-lista {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .resultado-item {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .resultado-item:hover {
        border-color: var(--accent);
    }

    .resultado-item img {
        width: 40px;
        height: 56px;
        object-fit: cover;
        border-radius: 4px;
    }

    .resultado-item .titulo {
        font-family: 'Space Mono', monospace;
        font-size: 0.9rem;
    }

    .resultado-item .año {
        font-size: 0.75rem;
        color: var(--text-muted);
    }
</style>

</head><body><div class="container"><header>
    <a href="index.html" class="back">←</a>
    <h1>Buscar en <span>Danimados</span></h1>
</header>

<div class="search-box">
    <span class="search-icon">$</span>

    <input
        type="text"
        id="inputBuscar"
        placeholder="Escribe un título y presiona Enter..."
        autocomplete="off"
    >
</div>

<div class="estado" id="estado">
    Escribe algo para buscar
</div>

<div
    class="resultados-lista"
    id="resultadosLista"
    style="display:none;"
></div>

<div class="ficha" id="ficha">

    <div class="ficha-header">

        <img
            class="ficha-img"
            id="fichaImg"
            src=""
            onerror="this.style.display='none'"
        >

        <div class="ficha-info">

            <h2 id="fichaTitulo"></h2>

            <div class="meta" id="fichaMeta"></div>

            <p
                class="sinopsis"
                id="fichaSinopsis"
            ></p>

        </div>

    </div>

    <div
        class="seccion"
        id="seccionTemp"
        style="display:none;"
    >
        <h3>📺 Temporadas</h3>

        <div
            class="lista-botones"
            id="listaTemp"
        ></div>
    </div>

    <div
        class="seccion"
        id="seccionEps"
        style="display:none;"
    >
        <h3>🎬 Episodios</h3>

        <div
            class="episodios-grid"
            id="listaEps"
        ></div>
    </div>

    <div
        class="seccion"
        id="seccionSrv"
        style="display:none;"
    >
        <h3>🎥 Servidores</h3>

        <div
            class="lista-botones"
            id="listaSrv"
        ></div>
    </div>

    <div id="seccionPlayer">

        <h3 style="
            font-family:'Space Mono',monospace;
            font-size:0.9rem;
            color:var(--accent);
            margin-bottom:12px;
        ">
            ▶️ Reproductor
        </h3>

        <div class="player-container">

            <iframe
                id="playerFrame"
                src="about:blank"
                allowfullscreen
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                referrerpolicy="no-referrer"
                sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
            ></iframe>

        </div>

        <div class="player-actions">

            <span
                class="player-info"
                id="playerInfo"
            >
                Selecciona un servidor para empezar
            </span>

            <button
                class="btn-servidor"
                onclick="cerrarPlayer()"
            >
                ✕ Cerrar
            </button>

        </div>

    </div>

</div>

</div><script>

const API = "https://danimados-api-1.onrender.com";

let serieActual = null;
let temporadaActual = null;
let episodioActual = null;

const input = document.getElementById("inputBuscar");
const estado = document.getElementById("estado");
const resultadosLista = document.getElementById("resultadosLista");
const ficha = document.getElementById("ficha");


// ============================================================
// BUSCAR
// ============================================================

async function buscar() {

    const q = input.value.trim();

    if (!q) {
        estado.textContent = "Escribe algo para buscar";
        estado.style.display = "block";
        return;
    }

    estado.textContent = "🔍 Buscando...";
    estado.style.display = "block";

    ficha.classList.remove("activa");
    resultadosLista.style.display = "none";

    cerrarPlayer();

    try {

        const url =
            `${API}/catalog?search=${encodeURIComponent(q)}&page=1&per_page=20`;

        console.log("Buscando:", url);

        const r = await fetch(url, {
            method: "GET",
            headers: {
                "Accept": "application/json"
            }
        });

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const data = await r.json();

        console.log("Respuesta API:", data);

        const resultados = data.results || [];

        if (resultados.length === 0) {
            estado.textContent = "❌ No se encontró nada";
            return;
        }

        if (resultados.length === 1) {
            cargarFicha(resultados[0].id);
            return;
        }

        estado.textContent =
            `${resultados.length} resultados. Elige uno:`;

        mostrarResultados(resultados);

    } catch (err) {

        console.error("Error de búsqueda:", err);

        estado.textContent =
            "❌ Error al conectar con la API: " + err.message;

    }
}


// ============================================================
// ENTER
// ============================================================

input.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {

        e.preventDefault();

        buscar();

    }

});


// ============================================================
// RESULTADOS
// ============================================================

function mostrarResultados(items) {

    resultadosLista.style.display = "flex";

    resultadosLista.innerHTML = items.map(s => {

        const titulo =
            s.title?.rendered ||
            s.title ||
            "Sin título";

        const imagen =
            s.cover_image?.medium ||
            s.cover_image?.large ||
            "";

        const año =
            s.date
                ? s.date.substring(0, 4)
                : "";

        return `
            <div
                class="resultado-item"
                onclick="cargarFicha(${Number(s.id)})"
            >

                <img
                    src="${imagen}"
                    onerror="this.style.display='none'"
                >

                <div>

                    <div class="titulo">
                        ${escapeHtml(titulo)}
                    </div>

                    <div class="año">
                        ${escapeHtml(año)}
                    </div>

                </div>

            </div>
        `;

    }).join("");

}


// ============================================================
// FICHA
// ============================================================

async function cargarFicha(id) {

    estado.textContent = "📋 Cargando ficha...";
    estado.style.display = "block";

    resultadosLista.style.display = "none";

    cerrarPlayer();

    try {

        const r =
            await fetch(`${API}/series/${encodeURIComponent(id)}`);

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const serie = await r.json();

        serieActual = serie;

        const titulo =
            serie.title?.rendered ||
            serie.title ||
            "Sin título";

        const fecha =
            serie.date
                ? serie.date.substring(0, 4)
                : "";

        const generos =
            (serie.class_list || [])
                .filter(c => c.startsWith("genres-"))
                .map(c =>
                    c
                        .replace("genres-", "")
                        .replace(/-/g, " ")
                )
                .slice(0, 4)
                .join(", ");

        document.getElementById("fichaTitulo").textContent =
            titulo;

        document.getElementById("fichaMeta").innerHTML =
            `<span>📅 ${escapeHtml(fecha)}</span>
             <span>🎭 ${escapeHtml(generos)}</span>`;

        document.getElementById("fichaSinopsis").textContent =
            limpiarHtml(
                serie.content?.rendered || ""
            ).slice(0, 400);

        const img =
            document.getElementById("fichaImg");

        img.style.display = "block";

        if (serie.cover_image?.large) {
            img.src = serie.cover_image.large;
        } else if (serie.cover_image?.medium) {
            img.src = serie.cover_image.medium;
        } else {
            img.style.display = "none";
        }

        estado.style.display = "none";

        ficha.classList.add("activa");

        cargarTemporadas(titulo);

    } catch (err) {

        console.error(err);

        estado.textContent =
            "❌ Error cargando ficha: " + err.message;

    }

}


// ============================================================
// TEMPORADAS
// ============================================================

async function cargarTemporadas(titulo) {

    const seccionTemp =
        document.getElementById("seccionTemp");

    const listaTemp =
        document.getElementById("listaTemp");

    seccionTemp.style.display = "none";

    try {

        const r =
            await fetch(
                `${API}/seasons/${encodeURIComponent(titulo)}`
            );

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const temps = await r.json();

        if (!Array.isArray(temps) || temps.length === 0) {
            return;
        }

        seccionTemp.style.display = "block";

        listaTemp.innerHTML =
            temps.map((t, i) => {

                const nombre =
                    t.title?.rendered ||
                    t.title ||
                    `Temporada ${i + 1}`;

                return `
                    <button
                        class="btn-servidor ${i === 0 ? "activo" : ""}"
                        data-index="${i}"
                    >
                        ${escapeHtml(nombre)}
                    </button>
                `;

            }).join("");

        const botones =
            listaTemp.querySelectorAll("button");

        botones.forEach((btn, i) => {

            btn.addEventListener("click", () => {

                seleccionarTemp(
                    temps[i],
                    btn
                );

            });

        });

        if (temps.length > 0) {
            seleccionarTemp(
                temps[0],
                botones[0]
            );
        }

    } catch (err) {

        console.error(
            "Error cargando temporadas:",
            err
        );

    }

}


// ============================================================
// SELECCIONAR TEMPORADA
// ============================================================

async function seleccionarTemp(temp, btn) {

    temporadaActual = temp;

    document
        .querySelectorAll("#listaTemp .btn-servidor")
        .forEach(b =>
            b.classList.remove("activo")
        );

    if (btn) {
        btn.classList.add("activo");
    }

    const seccionEps =
        document.getElementById("seccionEps");

    const listaEps =
        document.getElementById("listaEps");

    estado.textContent =
        "🎬 Cargando episodios...";

    estado.style.display = "block";

    cerrarPlayer();

    try {

        const seasonUrl =
            temp.link ||
            temp.url ||
            temp.guid?.rendered;

        if (!seasonUrl) {
            throw new Error(
                "La temporada no tiene URL"
            );
        }

        const r =
            await fetch(
                `${API}/episodes?season_url=${encodeURIComponent(seasonUrl)}`
            );

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const data = await r.json();

        const eps =
            data.episodes || [];

        if (eps.length === 0) {

            seccionEps.style.display = "none";

            estado.textContent =
                "⚠️ No hay episodios";

            return;
        }

        seccionEps.style.display = "block";

        listaEps.innerHTML =
            eps.map((url, i) => {

                return `
                    <button
                        class="ep-btn"
                        data-url="${encodeURIComponent(url)}"
                    >
                        Ep ${i + 1}
                    </button>
                `;

            }).join("");

        listaEps
            .querySelectorAll(".ep-btn")
            .forEach(btn => {

                btn.addEventListener(
                    "click",
                    () => {

                        seleccionarEp(
                            decodeURIComponent(
                                btn.dataset.url
                            ),
                            btn
                        );

                    }
                );

            });

        estado.style.display = "none";

    } catch (err) {

        estado.textContent =
            "❌ Error cargando episodios: " +
            err.message;

    }

}


// ============================================================
// EPISODIO
// ============================================================

async function seleccionarEp(url, btn) {

    document
        .querySelectorAll(".ep-btn")
        .forEach(b =>
            b.classList.remove("activo")
        );

    btn.classList.add("activo");

    episodioActual = url;

    const seccionSrv =
        document.getElementById("seccionSrv");

    const listaSrv =
        document.getElementById("listaSrv");

    estado.textContent =
        "🎥 Obteniendo servidores...";

    estado.style.display = "block";

    cerrarPlayer();

    try {

        const r =
            await fetch(
                `${API}/servers?episode_url=${encodeURIComponent(url)}`
            );

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const data = await r.json();

        const servidores =
            data.servidores || [];

        if (servidores.length === 0) {

            seccionSrv.style.display = "none";

            estado.textContent =
                "⚠️ Este episodio no tiene servidores disponibles";

            return;
        }

        seccionSrv.style.display = "block";

        listaSrv.innerHTML =
            servidores.map((s, i) => {

                return `
                    <button
                        class="btn-servidor"
                        data-index="${i}"
                    >
                        ▶️ ${escapeHtml(
                            s.nombre || s.dominio || "Servidor"
                        )}
                    </button>
                `;

            }).join("");

        listaSrv
            .querySelectorAll(".btn-servidor")
            .forEach((btn, i) => {

                btn.addEventListener(
                    "click",
                    () => {

                        reproducirServidor(
                            servidores[i].embed_url,
                            servidores[i].nombre ||
                            servidores[i].dominio ||
                            "Servidor",
                            btn
                        );

                    }
                );

            });

        estado.style.display = "none";

    } catch (err) {

        estado.textContent =
            "❌ Error cargando servidores: " +
            err.message;

    }

}


// ============================================================
// REPRODUCIR
// ============================================================

function reproducirServidor(
    embed_url,
    nombre,
    btn
) {

    if (!embed_url) {
        estado.textContent =
            "❌ Este servidor no tiene enlace";
        return;
    }

    document
        .querySelectorAll("#listaSrv .btn-servidor")
        .forEach(b =>
            b.classList.remove("activo")
        );

    if (btn) {
        btn.classList.add("activo");
    }

    const seccionPlayer =
        document.getElementById("seccionPlayer");

    const playerFrame =
        document.getElementById("playerFrame");

    const playerInfo =
        document.getElementById("playerInfo");

    seccionPlayer.classList.add("activa");

    playerFrame.src = embed_url;

    playerInfo.textContent =
        `Reproduciendo en ${nombre}`;

    setTimeout(() => {

        seccionPlayer.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);

}


// ============================================================
// CERRAR PLAYER
// ============================================================

function cerrarPlayer() {

    const seccionPlayer =
        document.getElementById("seccionPlayer");

    const playerFrame =
        document.getElementById("playerFrame");

    const playerInfo =
        document.getElementById("playerInfo");

    if (playerFrame) {
        playerFrame.src =
            "about:blank";
    }

    if (seccionPlayer) {
        seccionPlayer.classList.remove("activa");
    }

    if (playerInfo) {
        playerInfo.textContent =
            "Selecciona un servidor para empezar";
    }

    document
        .querySelectorAll("#listaSrv .btn-servidor")
        .forEach(b =>
            b.classList.remove("activo")
        );

}


// ============================================================
// UTILIDADES
// ============================================================

function limpiarHtml(html) {

    const div =
        document.createElement("div");

    div.innerHTML = html;

    return div.textContent ||
           div.innerText ||
           "";

}

function escapeHtml(text) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script></body>
</html>
