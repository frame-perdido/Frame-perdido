<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar en Danimados — Frame Perdido</title><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #0a0a0f;
        --bg-card: #12121a;
        --bg-elevated: #1a1a25;
        --text: #e8e8f0;
        --text-muted: #8a8a9a;
        --text-dim: #5a5a6a;
        --accent: #d4a373;
        --accent-soft: #d4a37320;
        --border: #2a2420;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }

    .back {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 1.2rem;
    }

    .back:hover {
        color: var(--accent);
    }

    h1 {
        font-family: 'Space Mono', monospace;
        font-size: 1.4rem;
    }

    h1 span {
        color: var(--accent);
    }

    .search-box {
        position: relative;
        margin-bottom: 30px;
    }

    .search-box input {
        width: 100%;
        padding: 16px 20px 16px 50px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 1rem;
        font-family: 'Space Mono', monospace;
        outline: none;
    }

    .search-box input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
    }

    .estado {
        text-align: center;
        padding: 30px;
        color: var(--text-muted);
        font-family: 'Space Mono', monospace;
        font-size: 0.85rem;
    }

    .ficha {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
        display: none;
    }

    .ficha.activa {
        display: block;
    }

    .ficha-header {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .ficha-img {
        width: 150px;
        border-radius: 8px;
        border: 1px solid var(--border);
    }

    .ficha-info {
        flex: 1;
        min-width: 200px;
    }

    .ficha-info h2 {
        font-family: 'Space Mono', monospace;
        font-size: 1.3rem;
        margin-bottom: 8px;
    }

    .meta {
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-bottom: 12px;
    }

    .meta span {
        margin-right: 12px;
    }

    .sinopsis {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.7;
    }

    .seccion {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .seccion h3 {
        font-family: 'Space Mono', monospace;
        font-size: 0.9rem;
        color: var(--accent);
        margin-bottom: 12px;
    }

    .lista-botones {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .btn-servidor {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-family: 'Space Mono', monospace;
        font-size: 0.8rem;
        text-decoration: none;
        display: inline-block;
        transition: all 0.2s;
    }

    .btn-servidor:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .btn-servidor.activo {
        background: var(--accent);
        color: #0a0a0f;
        border-color: var(--accent);
    }

    #seccionPlayer {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        display: none;
    }

    #seccionPlayer.activa {
        display: block;
    }

    .player-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .player-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }

    .player-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
        align-items: center;
    }

    .player-info {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: 'Space Mono', monospace;
        flex: 1;
    }

    .episodios-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 200px;
        overflow-y: auto;
        padding: 8px 0;
    }

    .ep-btn {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.75rem;
        font-family: 'Space Mono', monospace;
    }

    .ep-btn:hover,
    .ep-btn.activo {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
    }

    .resultados-lista {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .resultado-item {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .resultado-item:hover {
        border-color: var(--accent);
    }

    .resultado-item img {
        width: 40px;
        height: 56px;
        object-fit: cover;
        border-radius: 4px;
    }

    .resultado-item .titulo {
        font-family: 'Space Mono', monospace;
        font-size: 0.9rem;
    }

    .resultado-item .año {
        font-size: 0.75rem;
        color: var(--text-muted);
    }

    .cargando {
        opacity: 0.7;
    }
</style>

</head><body><div class="container"><header>
    <a href="index.html" class="back">←</a>
    <h1>Buscar en <span>Danimados</span></h1>
</header>

<div class="search-box">
    <span class="search-icon">$</span>
    <input
        type="text"
        id="inputBuscar"
        placeholder="Escribe un título y presiona Enter..."
        autocomplete="off"
    >
</div>

<div class="estado" id="estado">
    Escribe algo para buscar
</div>

<div class="resultados-lista" id="resultadosLista" style="display:none;"></div>

<div class="ficha" id="ficha">

    <div class="ficha-header">

        <img
            class="ficha-img"
            id="fichaImg"
            src=""
            onerror="this.style.display='none'"
        >

        <div class="ficha-info">

            <h2 id="fichaTitulo"></h2>

            <div class="meta" id="fichaMeta"></div>

            <p class="sinopsis" id="fichaSinopsis"></p>

        </div>

    </div>

    <div class="seccion" id="seccionTemp" style="display:none;">
        <h3>📺 Temporadas</h3>
        <div class="lista-botones" id="listaTemp"></div>
    </div>

    <div class="seccion" id="seccionEps" style="display:none;">
        <h3>🎬 Episodios</h3>
        <div class="episodios-grid" id="listaEps"></div>
    </div>

    <div class="seccion" id="seccionSrv" style="display:none;">
        <h3>🎥 Servidores</h3>
        <div class="lista-botones" id="listaSrv"></div>
    </div>

    <div id="seccionPlayer">

        <h3 style="
            font-family:'Space Mono',monospace;
            font-size:0.9rem;
            color:var(--accent);
            margin-bottom:12px;
        ">
            ▶️ Reproductor
        </h3>

        <div class="player-container">

            <iframe
                id="playerFrame"
                src="about:blank"
                allowfullscreen
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                referrerpolicy="no-referrer"
                sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
            ></iframe>

        </div>

        <div class="player-actions">

            <span class="player-info" id="playerInfo">
                Selecciona un servidor para empezar
            </span>

            <button
                class="btn-servidor"
                onclick="cerrarPlayer()"
            >
                ✕ Cerrar
            </button>

        </div>

    </div>

</div>

</div><script>

const API = "https://danimados-api-1.onrender.com";

let serieActual = null;
let temporadaActual = null;
let episodioActual = null;

const input = document.getElementById("inputBuscar");
const estado = document.getElementById("estado");
const resultadosLista = document.getElementById("resultadosLista");
const ficha = document.getElementById("ficha");


// ============================================================
// BUSCAR
// ============================================================

input.addEventListener("keydown", async (e) => {

    if (e.key !== "Enter") return;

    const q = input.value.trim();

    if (!q) return;

    estado.textContent = "🔍 Buscando...";
    estado.style.display = "block";

    ficha.classList.remove("activa");
    resultadosLista.style.display = "none";

    cerrarPlayer();

    try {

        const r = await fetch(
            `${API}/catalog?search=${encodeURIComponent(q)}`
        );

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const data = await r.json();

        if (!data.results || data.results.length === 0) {

            estado.textContent = "❌ No se encontró nada";

            return;
        }

        if (data.results.length === 1) {

            cargarFicha(data.results[0].id);

            return;
        }

        estado.textContent =
            `${data.results.length} resultados. Elige uno:`;

        mostrarResultados(data.results);

    } catch (err) {

        console.error(err);

        estado.textContent =
            "❌ Error: " + err.message;

    }

});


// ============================================================
// RESULTADOS
// ============================================================

function mostrarResultados(items) {

    resultadosLista.style.display = "flex";

    resultadosLista.innerHTML = items.map(s => {

        const titulo =
            s.title?.rendered ||
            "Sin título";

        const año =
            s.date?.substring(0, 4) ||
            "";

        const imagen =
            s.cover_image?.medium ||
            "";

        return `
            <div
                class="resultado-item"
                onclick="cargarFicha(${s.id})"
            >

                <img
                    src="${imagen}"
                    onerror="this.style.display='none'"
                >

                <div>

                    <div class="titulo">
                        ${titulo}
                    </div>

                    <div class="año">
                        ${año}
                    </div>

                </div>

            </div>
        `;

    }).join("");

}


// ============================================================
// FICHA
// ============================================================

async function cargarFicha(id) {

    estado.textContent = "📋 Cargando ficha...";

    estado.style.display = "block";

    resultadosLista.style.display = "none";

    cerrarPlayer();

    try {

        const r = await fetch(
            `${API}/series/${id}`
        );

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const serie = await r.json();

        serieActual = serie;

        const titulo =
            serie.title?.rendered ||
            "Sin título";

        const fecha =
            serie.date?.substring(0, 4) ||
            "";

        const generos =
            (serie.class_list || [])
                .filter(c => c.startsWith("genres-"))
                .map(c =>
                    c.replace("genres-", "")
                     .replace(/-/g, " ")
                )
                .slice(0, 4)
                .join(", ");

        document.getElementById(
            "fichaTitulo"
        ).textContent = titulo;

        document.getElementById(
            "fichaMeta"
        ).innerHTML =
            `<span>📅 ${fecha}</span>
             <span>🎭 ${generos}</span>`;

        document.getElementById(
            "fichaSinopsis"
        ).textContent =
            (serie.content?.rendered || "")
                .replace(/<[^>]+>/g, "")
                .slice(0, 400);

        const imagen =
            serie.cover_image?.large ||
            serie.cover_image?.medium ||
            "";

        const fichaImg =
            document.getElementById("fichaImg");

        if (imagen) {

            fichaImg.style.display = "block";
            fichaImg.src = imagen;

        } else {

            fichaImg.style.display = "none";

        }

        estado.style.display = "none";

        ficha.classList.add("activa");

        cargarTemporadas(titulo);

    } catch (err) {

        console.error(err);

        estado.textContent =
            "❌ Error: " + err.message;

    }

}


// ============================================================
// TEMPORADAS
// ============================================================

async function cargarTemporadas(titulo) {

    const seccionTemp =
        document.getElementById("seccionTemp");

    const listaTemp =
        document.getElementById("listaTemp");

    try {

        const r = await fetch(
            `${API}/seasons/${encodeURIComponent(titulo)}`
        );

        if (!r.ok) {

            throw new Error(
                `HTTP ${r.status}`
            );

        }

        const temps = await r.json();

        if (!temps || temps.length === 0) {

            seccionTemp.style.display = "none";

            return;
        }

        seccionTemp.style.display = "block";

        listaTemp.innerHTML =
            temps.map((t, i) => {

                const nombre =
                    t.title?.rendered ||
                    `Temporada ${i + 1}`;

                return `
                    <button
                        class="btn-servidor ${i === 0 ? "activo" : ""}"
                        onclick="seleccionarTemp(
                            ${JSON.stringify(t).replace(/"/g, "&quot;")},
                            this
                        )"
                    >
                        ${nombre}
                    </button>
                `;

            }).join("");

        seleccionarTemp(
            temps[0],
            listaTemp.firstElementChild
        );

    } catch (err) {

        console.error(
            "Error cargando temporadas:",
            err
        );

    }

}


// ============================================================
// SELECCIONAR TEMPORADA
// ============================================================

async function seleccionarTemp(temp, btn) {

    temporadaActual = temp;

    document
        .querySelectorAll(
            "#listaTemp .btn-servidor"
        )
        .forEach(b =>
            b.classList.remove("activo")
        );

    if (btn) {
        btn.classList.add("activo");
    }

    const seccionEps =
        document.getElementById("seccionEps");

    const listaEps =
        document.getElementById("listaEps");

    estado.textContent =
        "🎬 Cargando episodios...";

    estado.style.display = "block";

    cerrarPlayer();

    try {

        const r = await fetch(
            `${API}/episodes?season_url=${encodeURIComponent(temp.link)}`
        );

        if (!r.ok) {

            throw new Error(
                `HTTP ${r.status}`
            );

        }

        const data = await r.json();

        const eps = data.episodes || [];

        if (eps.length === 0) {

            seccionEps.style.display = "none";

            estado.style.display = "none";

            return;
        }

        seccionEps.style.display = "block";

        listaEps.innerHTML =
            eps.map((url, i) => {

                return `
                    <button
                        class="ep-btn"
                        onclick="seleccionarEp(
                            ${JSON.stringify(url)},
                            this
                        )"
                    >
                        Ep ${i + 1}
                    </button>
                `;

            }).join("");

        estado.style.display = "none";

    } catch (err) {

        console.error(err);

        estado.textContent =
            "❌ Error cargando episodios: " +
            err.message;

    }

}


// ============================================================
// SELECCIONAR EPISODIO
// ============================================================

async function seleccionarEp(url, btn) {

    document
        .querySelectorAll(".ep-btn")
        .forEach(b =>
            b.classList.remove("activo")
        );

    btn.classList.add("activo");

    episodioActual = url;

    const seccionSrv =
        document.getElementById("seccionSrv");

    const listaSrv =
        document.getElementById("listaSrv");

    estado.textContent =
        "🎥 Obteniendo servidores...";

    estado.style.display = "block";

    cerrarPlayer();

    try {

        const r = await fetch(
            `${API}/servers?episode_url=${encodeURIComponent(url)}`
        );

        if (!r.ok) {

            throw new Error(
                `HTTP ${r.status}`
            );

        }

        const data = await r.json();

        const servidores =
            data.servidores || [];

        if (servidores.length === 0) {

            seccionSrv.style.display = "none";

            estado.textContent =
                "⚠️ Este episodio no tiene servidores disponibles";

            return;
        }

        seccionSrv.style.display = "block";

        listaSrv.innerHTML =
            servidores.map(s => {

                return `
                    <button
                        class="btn-servidor"
                        onclick="reproducirServidor(
                            ${JSON.stringify(s.embed_url)},
                            ${JSON.stringify(s.nombre)},
                            this
                        )"
                    >
                        ▶️ ${s.nombre}
                    </button>
                `;

            }).join("");

        estado.style.display = "none";

    } catch (err) {

        console.error(err);

        estado.textContent =
            "❌ Error cargando servidores: " +
            err.message;

    }

}


// ============================================================
// REPRODUCIR SERVIDOR
// ============================================================

function reproducirServidor(
    embed_url,
    nombre,
    btn
) {

    document
        .querySelectorAll(
            "#listaSrv .btn-servidor"
        )
        .forEach(b =>
            b.classList.remove("activo")
        );

    if (btn) {
        btn.classList.add("activo");
    }

    const seccionPlayer =
        document.getElementById(
            "seccionPlayer"
        );

    const playerFrame =
        document.getElementById(
