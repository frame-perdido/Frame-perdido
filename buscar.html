<!DOCTYPE html>  <html lang="es">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Buscar en Danimados</title>  <style>  
    * {  
        box-sizing: border-box;  
    }  

    body {  
        margin: 0;  
        padding: 30px 15px;  
        background: #111;  
        color: #fff;  
        font-family: Arial, sans-serif;  
    }  

    .contenedor {  
        max-width: 900px;  
        margin: auto;  
    }  

    h1 {  
        margin-bottom: 20px;  
    }  

    .buscador {  
        display: flex;  
        gap: 10px;  
        margin-bottom: 25px;  
    }  

    #searchInput {  
        flex: 1;  
        padding: 14px;  
        border: 1px solid #444;  
        border-radius: 8px;  
        background: #222;  
        color: #fff;  
        font-size: 16px;  
    }  

    button {  
        padding: 14px 20px;  
        border: 0;  
        border-radius: 8px;  
        background: #ff6b35;  
        color: white;  
        font-weight: bold;  
        cursor: pointer;  
    }  

    button:hover {  
        opacity: .85;  
    }  

    #estado {  
        margin: 15px 0;  
        color: #aaa;  
    }  

    .resultado {  
        display: flex;  
        gap: 15px;  
        padding: 15px;  
        margin-bottom: 12px;  
        background: #1c1c1c;  
        border-radius: 10px;  
    }  

    .resultado img {  
        width: 100px;  
        height: 140px;  
        object-fit: cover;  
        border-radius: 6px;  
        background: #333;  
    }  

    .info {  
        flex: 1;  
    }  

    .info h2 {  
        margin: 0 0 8px;  
        font-size: 20px;  
    }  

    .info p {  
        color: #aaa;  
        margin: 6px 0;  
    }  

    .ver {  
        display: inline-block;  
        margin-top: 10px;  
        padding: 9px 14px;  
        background: #ff6b35;  
        color: white;  
        border-radius: 6px;  
        text-decoration: none;  
    }  

    @media (max-width: 600px) {  
        .buscador {  
            flex-direction: column;  
        }  

        .resultado img {  
            width: 80px;  
            height: 115px;  
        }  
    }  
</style>

</head>  <body>  <div class="contenedor">  <h1>Buscar en Danimados</h1>  

<div class="buscador">  
    <input  
        type="text"  
        id="searchInput"  
        placeholder="Escribe el nombre de una serie..."  
        autocomplete="off"  
    >  

    <button onclick="buscar()">Buscar</button>  
</div>  

<div id="estado"></div>  

<div id="resultados"></div>

</div>  <script>  
  
const API = "https://TU-API.onrender.com";  
  
const input = document.getElementById("searchInput");  
const resultados = document.getElementById("resultados");  
const estado = document.getElementById("estado");  
  
input.addEventListener("keydown", function(event) {  
    if (event.key === "Enter") {  
        buscar();  
    }  
});  
  
async function buscar() {  
  
    const texto = input.value.trim();  
  
    if (!texto) {  
        estado.textContent = "Escribe algo para buscar.";  
        resultados.innerHTML = "";  
        return;  
    }  
  
    estado.textContent = "Buscando...";  
    resultados.innerHTML = "";  
  
    try {  
  
        const url =  
            API +  
            "/catalog?search=" +  
            encodeURIComponent(texto) +  
            "&page=1&per_page=20";  
  
        const respuesta = await fetch(url);  
  
        if (!respuesta.ok) {  
            throw new Error("Error HTTP " + respuesta.status);  
        }  
  
        const datos = await respuesta.json();  
  
        const lista = datos.results || [];  
  
        if (lista.length === 0) {  
            estado.textContent = "No se encontraron resultados.";  
            return;  
        }  
  
        estado.textContent =  
            "Resultados encontrados: " + lista.length;  
  
        lista.forEach(serie => {  
  
            const titulo =  
                serie.title?.rendered ||  
                "Sin título";  
  
            const enlace =  
                serie.link ||  
                "#";  
  
            const contenido =  
                serie.excerpt?.rendered ||  
                "";  
  
            const imagen =  
                serie.jetpack_featured_media_url ||  
                serie.featured_image ||  
                "";  
  
            const div = document.createElement("div");  
  
            div.className = "resultado";  
  
            div.innerHTML = `  
  
                ${  
                    imagen  
                    ? `<img src="${imagen}" alt="${titulo}">`  
                    : `<div style="  
                        width:100px;  
                        height:140px;  
                        background:#333;  
                        border-radius:6px;  
                    "></div>`  
                }  
  
                <div class="info">  
  
                    <h2>${titulo}</h2>  
  
                    <p>${contenido}</p>  
  
                    <a  
                        class="ver"  
                        href="${enlace}"  
                        target="_blank"  
                        rel="noopener"  
                    >  
                        Ver ficha  
                    </a>  
  
                </div>  
            `;  
  
            resultados.appendChild(div);  
        });  
  
    } catch (error) {  
  
        console.error(error);  
  
        estado.textContent =  
            "No se pudo conectar con la API.";  
  
    }  
}  
  
</script>  </body>  
</html>
