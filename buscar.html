<script>
    const API = "https://danimados-api-1.onrender.com";

    let serieActual = null;
    let temporadaActual = null;
    let episodioActual = null;

    const input = document.getElementById("inputBuscar");
    const estado = document.getElementById("estado");
    const resultadosLista = document.getElementById("resultadosLista");
    const ficha = document.getElementById("ficha");

    // ============================================================
    // BUSCAR
    // ============================================================

    input.addEventListener("keydown", async (e) => {
        if (e.key !== "Enter") return;

        const q = input.value.trim();
        if (!q) return;

        estado.textContent = "🔍 Buscando...";
        estado.style.display = "block";

        ficha.classList.remove("activa");
        resultadosLista.style.display = "none";
        cerrarPlayer();

        try {
            const r = await fetch(
                `${API}/catalog?search=${encodeURIComponent(q)}`
            );

            if (!r.ok) {
                throw new Error(`HTTP ${r.status}`);
            }

            const data = await r.json();

            if (!data.results || data.results.length === 0) {
                estado.textContent = "❌ No se encontró nada";
                return;
            }

            if (data.results.length === 1) {
                cargarFicha(data.results[0].id);
                return;
            }

            estado.textContent =
                `${data.results.length} resultados. Elige uno:`;

            mostrarResultados(data.results);

        } catch (err) {
            estado.textContent = "❌ Error: " + err.message;
        }
    });

    // ============================================================
    // RESULTADOS
    // ============================================================

    function mostrarResultados(items) {
        resultadosLista.style.display = "flex";

        resultadosLista.innerHTML = items.map(s => `
            <div class="resultado-item"
                 onclick="cargarFicha(${s.id})">

                <img
                    src="${s.cover_image?.medium || ''}"
                    onerror="this.style.display='none'"
                >

                <div>
                    <div class="titulo">
                        ${s.title?.rendered || "Sin título"}
                    </div>

                    <div class="año">
                        ${s.date?.substring(0, 4) || ""}
                    </div>
                </div>

            </div>
        `).join("");
    }

    // ============================================================
    // FICHA
    // ============================================================

    async function cargarFicha(id) {

        estado.textContent = "📋 Cargando ficha...";
        estado.style.display = "block";

        resultadosLista.style.display = "none";
        cerrarPlayer();

        try {

            const r = await fetch(`${API}/series/${id}`);

            if (!r.ok) {
                throw new Error(`HTTP ${r.status}`);
            }

            const serie = await r.json();

            serieActual = serie;

            const titulo =
                serie.title?.rendered || "Sin título";

            const fecha =
                serie.date?.substring(0, 4) || "";

            const generos =
                (serie.class_list || [])
                    .filter(c => c.startsWith("genres-"))
                    .map(c =>
                        c.replace("genres-", "")
                         .replace(/-/g, " ")
                    )
                    .slice(0, 4)
                    .join(", ");

            document.getElementById("fichaTitulo").textContent =
                titulo;

            document.getElementById("fichaMeta").innerHTML =
                `<span>📅 ${fecha}</span>
                 <span>🎭 ${generos}</span>`;

            document.getElementById("fichaSinopsis").textContent =
                (serie.content?.rendered || "")
                    .replace(/<[^>]+>/g, "")
                    .slice(0, 400);

            const imagen =
                document.getElementById("fichaImg");

            if (serie.cover_image?.large) {
                imagen.src = serie.cover_image.large;
                imagen.style.display = "block";
            }

            estado.style.display = "none";

            ficha.classList.add("activa");

            cargarTemporadas(titulo);

        } catch (err) {

            estado.textContent =
                "❌ Error: " + err.message;
        }
    }

    // ============================================================
    // TEMPORADAS
    // ============================================================

    async function cargarTemporadas(titulo) {

        const seccionTemp =
            document.getElementById("seccionTemp");

        const listaTemp =
            document.getElementById("listaTemp");

        try {

            const r = await fetch(
                `${API}/seasons/${encodeURIComponent(titulo)}`
            );

            if (!r.ok) {
                throw new Error(`HTTP ${r.status}`);
            }

            const temps = await r.json();

            if (!temps || temps.length === 0) {
                seccionTemp.style.display = "none";
                return;
            }

            seccionTemp.style.display = "block";

            listaTemp.innerHTML = temps.map((t, i) => `
                <button
                    class="btn-servidor ${i === 0 ? "activo" : ""}"
                    onclick='seleccionarTemp(
                        ${JSON.stringify(t)},
                        this
                    )'
                >
                    ${t.title?.rendered || `Temporada ${i + 1}`}
                </button>
            `).join("");

            seleccionarTemp(
                temps[0],
                listaTemp.firstElementChild
            );

        } catch (err) {

            console.error(
                "Error cargando temporadas:",
                err
            );
        }
    }

    // ============================================================
    // TEMPORADA
    // ============================================================

    async function seleccionarTemp(temp, btn) {

        temporadaActual = temp;

        document
            .querySelectorAll("#listaTemp .btn-servidor")
            .forEach(b => b.classList.remove("activo"));

        if (btn) {
            btn.classList.add("activo");
        }

        const seccionEps =
            document.getElementById("seccionEps");

        const listaEps =
            document.getElementById("listaEps");

        estado.textContent =
            "🎬 Cargando episodios...";

        estado.style.display = "block";

        cerrarPlayer();

        try {

            const r = await fetch(
                `${API}/episodes?season_url=${encodeURIComponent(temp.link)}`
            );

            if (!r.ok) {
                throw new Error(`HTTP ${r.status}`);
            }

            const data = await r.json();

            const eps = data.episodes || [];

            if (eps.length === 0) {

                seccionEps.style.display = "none";

                estado.textContent =
                    "⚠️ No hay episodios";

                return;
            }

            seccionEps.style.display = "block";

            listaEps.innerHTML = eps.map((url, i) => `
                <button
                    class="ep-btn"
                    onclick="seleccionarEp(
                        '${url.replace(/'/g, "\\'")}',
                        this
                    )"
                >
                    Ep ${i + 1}
                </button>
            `).join("");

            estado.style.display = "none";

        } catch (err) {

            estado.textContent =
                "❌ Error cargando episodios: " +
                err.message;
        }
    }

    // ============================================================
    // EPISODIO
    // ============================================================

    async function seleccionarEp(url, btn) {

        document
            .querySelectorAll(".ep-btn")
            .forEach(b => b.classList.remove("activo"));

        btn.classList.add("activo");

        episodioActual = url;

        const seccionSrv =
            document.getElementById("seccionSrv");

        const listaSrv =
            document.getElementById("listaSrv");

        estado.textContent =
            "🎥 Obteniendo servidores...";

        estado.style.display = "block";

        cerrarPlayer();

        try {

            const r = await fetch(
                `${API}/servers?episode_url=${encodeURIComponent(url)}`
            );

            if (!r.ok) {
                throw new Error(`HTTP ${r.status}`);
            }

            const data = await r.json();

            const servidores =
                data.servidores || [];

            if (servidores.length === 0) {

                seccionSrv.style.display = "none";

                estado.textContent =
                    "⚠️ Este episodio no tiene servidores disponibles";

                return;
            }

            seccionSrv.style.display = "block";

            listaSrv.innerHTML =
                servidores.map((s, i) => `
                    <button
                        class="btn-servidor"
                        onclick='reproducirServidor(
                            ${JSON.stringify(s.embed_url)},
                            ${JSON.stringify(s.nombre)},
                            this
                        )'
                    >
                        ▶️ ${s.nombre}
                    </button>
                `).join("");

            estado.style.display = "none";

        } catch (err) {

            estado.textContent =
                "❌ Error cargando servidores: " +
                err.message;
        }
    }

    // ============================================================
    // RESOLVER + REPRODUCTOR
    // ============================================================

    async function reproducirServidor(embedUrl, nombre, btn) {

        document
            .querySelectorAll("#listaSrv .btn-servidor")
            .forEach(b => b.classList.remove("activo"));

        if (btn) {
            btn.classList.add("activo");
        }

        const seccionPlayer =
            document.getElementById("seccionPlayer");

        const playerFrame =
            document.getElementById("playerFrame");

        const playerInfo =
            document.getElementById("playerInfo");

        seccionPlayer.classList.add("activa");

        playerInfo.textContent =
            `Resolviendo ${nombre}...`;

        // No cargamos directamente el embed.
        // Primero se lo pasamos a /resolve.

        try {

            const r = await fetch(
                `${API}/resolve?embed_url=${encodeURIComponent(embedUrl)}`
            );

            if (!r.ok) {

                let mensaje = `HTTP ${r.status}`;

                try {
                    const errorData = await r.json();

                    if (errorData.detail) {
                        mensaje = errorData.detail;
                    }
                } catch (_) {}

                throw new Error(mensaje);
            }

            const data = await r.json();

            console.log("Respuesta /resolve:", data);

            const urls =
                data.solicitudes_relevantes || [];

            const respuestas =
                data.respuestas_relevantes || [];

            // Buscar primero m3u8
            let streamUrl =
                urls.find(u =>
                    /\.m3u8(?:\?|#|$)/i.test(u)
                );

            // Después mp4
            if (!streamUrl) {
                streamUrl =
                    urls.find(u =>
                        /\.mp4(?:\?|#|$)/i.test(u)
                    );
            }

            // Si no apareció en requests,
            // buscarlo en responses.

            if (!streamUrl) {

                const respuesta =
                    respuestas.find(r =>
                        /\.m3u8(?:\?|#|$)/i.test(r.url)
                    ) ||
                    respuestas.find(r =>
                        /\.mp4(?:\?|#|$)/i.test(r.url)
                    );

                if (respuesta) {
                    streamUrl = respuesta.url;
                }
            }

            if (!streamUrl) {

                playerInfo.textContent =
                    `❌ ${nombre}: no se encontró el stream`;

                console.log(
                    "Respuesta completa:",
                    data
                );

                return;
            }

            console.log(
                "STREAM ENCONTRADO:",
                streamUrl
            );

            // ====================================================
            // IMPORTANTE
            // ====================================================
            //
            // Si es una URL directa, un iframe NO siempre puede
            // reproducir m3u8/mp4.
            //
            // Primero probamos cargarla directamente.
            //

            playerFrame.removeAttribute("sandbox");

            playerFrame.src = streamUrl;

            playerInfo.textContent =
                `▶️ ${nombre} · stream ${streamUrl.includes(".m3u8") ? "HLS" : "MP4"}`;

            setTimeout(() => {

                seccionPlayer.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }, 100);

        } catch (err) {

            console.error(
                "Error resolviendo:",
                err
            );

            playerInfo.textContent =
                `❌ Error con ${nombre}: ${err.message}`;
        }
    }

    // ============================================================
    // CERRAR PLAYER
    // ============================================================

    function cerrarPlayer() {

        const seccionPlayer =
            document.getElementById("seccionPlayer");

        const playerFrame =
            document.getElementById("playerFrame");

        const playerInfo =
            document.getElementById("playerInfo");

        if (playerFrame) {
            playerFrame.src = "about:blank";
        }

        if (seccionPlayer) {
            seccionPlayer.classList.remove("activa");
        }

        if (playerInfo) {
            playerInfo.textContent =
                "Selecciona un servidor para empezar";
        }

        document
            .querySelectorAll("#listaSrv .btn-servidor")
            .forEach(b => b.classList.remove("activo"));
    }
</script>
