    <style>
        /* ============================================================
           VARIABLES Y RESET
           ============================================================ */
        :root {
            --bg: #0a0a0f;
            --bg-card: #12121a;
            --bg-elevated: #1a1a25;
            --text: #e8e8f0;
            --text-muted: #8a8a9a;
            --text-dim: #5a5a6a;
            --accent: #ff6b35;
            --accent-soft: #ff6b3520;
            --accent-glow: #ff6b3560;
            --border: #2a2a3a;
            --border-hover: #3a3a50;
            --plyr-color-main: #ff6b35;
            --plyr-video-control-color: #e8e8f0;
            --plyr-video-control-color-hover: #ffffff;
            --plyr-video-control-background-hover: rgba(255,107,53,0.2);
            --plyr-range-fill-background: #ff6b35;
            --plyr-range-thumb-background: #ff6b35;
            --plyr-range-thumb-shadow: 0 0 10px rgba(255,107,53,0.5);
            --plyr-menu-background: #12121a;
            --plyr-menu-color: #e8e8f0;
            --plyr-tooltip-background: #1a1a25;
            --plyr-tooltip-color: #e8e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-page {
            max-width: 1100px;
            width: 100%;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .video-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .video-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: opacity 0.3s;
        }
        .back-btn:hover { opacity: 0.7; }

        /* ============================================================
           PLYR REPRODUCTOR
           ============================================================ */
        .plyr-container {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .plyr--video {
            border-radius: 16px;
        }
        .plyr--video .plyr__controls {
            padding: 16px 20px;
        }

        /* Forzar rotación en pantalla completa */
        .plyr--fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
        }

        /* ============================================================
           SELECTOR DE EPISODIOS
           ============================================================ */
        .episode-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .episode-btn {
            padding: 5px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .episode-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .episode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .version-separator {
            color: var(--text-muted);
            padding: 0 10px;
            font-size: 0.9rem;
            opacity: 0.4;
            user-select: none;
        }

        /* ============================================================
           INFO DEL EXPEDIENTE
           ============================================================ */
        .expediente-info {
            margin-top: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        .expediente-info h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .expediente-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .expediente-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .exp-tag {
            background: #1a1a25;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
        }

        /* ============================================================
           ERROR
           ============================================================ */
        .error-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 480px;
            margin: 0 auto;
        }
        .error-box h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }
        .error-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .error-box .id-received {
            display: inline-block;
            background: #1a1a25;
            border: 1px solid var(--border);
            color: #5a5a6a;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'Space Grotesk', monospace;
            margin: 12px 0;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .video-title { font-size: 1.1rem; }
            body { padding: 10px; }
            .plyr-container { border-radius: 12px; }
            .expediente-info { padding: 16px; }
        }
        @media (orientation: portrait) {
            .plyr--fullscreen video {
                transform: rotate(0deg) !important;
            }
        }
    </style>
</head>

            return url && (url.includes('youtube.com/embed') || url.includes('youtu.be'));

       function obtenerUrlClean(url) {
    if (!url) return '';

    // Mega: no necesita parámetros extras
    if (esVideoMega(url)) {
        return url;
    }

    // YouTube: limpiar URL y agregar parámetros
    if (esVideoYouTube(url)) {
        // Extraer solo el ID del video (eliminar todos los parámetros)
        let cleanUrl = url;
        
        // Si tiene ? o &, tomar solo la parte antes del primer ?
        if (url.includes('?')) {
            cleanUrl = url.split('?')[0];
        }
        
        // Agregar parámetros necesarios
        return cleanUrl + '?rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&origin=' + encodeURIComponent(window.location.origin);
    }

    // Otros: devolver como está
    return url;
}

            let primerBoton = true;

            episodios.forEach(e => {
                // Si cambia la versión y no es el primer botón, agregar separador
                if (!primerBoton && e.version !== ultimaVersion) {
                    botonesHtml += `<span class="version-separator">|</span>`;
                }
                primerBoton = false;
                ultimaVersion = e.version;

                const isActive = (e.num === episodioActual.num && e.version === episodioActual.version);
                const activeClass = isActive ? 'active' : '';
                let label = e.version ? `${e.version}${e.num}` : `Ep. ${e.num}`;

                botonesHtml += `
                    <button class="episode-btn ${activeClass}" 
                            onclick="cambiarEpisodio(${id}, ${e.num}, '${e.version}')">
                        ${label}
                    </button>
                `;
            });

            const mostrarSelector = episodios.length > 1;

            // ============================================================
            // TÍTULO CON EPISODIO
            // ============================================================
            let titleSuffix = '';
            if (episodioActual.version) {
                titleSuffix = ` — ${episodioActual.version} ${episodioActual.num}`;
            } else if (episodios.length > 1) {
                titleSuffix = ` — Episodio ${episodioActual.num}`;
            }

            // ============================================================
            // URL LIMPIA
            // ============================================================
            const cleanUrl = obtenerUrlClean(episodioActual.url);

            // ============================================================
            // RENDERIZAR
            // ============================================================
            app.innerHTML = `
                <div class="video-header">
                    <div>
                        <h1 class="video-title">${v.title}${titleSuffix}</h1>
                        <span class="video-meta">${v.year} · ${v.studio} · ${v.director}</span>
                    </div>
                    <a href="index.html" class="back-btn">← Volver</a>
                </div>

                <div class="plyr-container">
                    <div class="plyr__video-embed" id="player">
                        <iframe
                            src="${cleanUrl}"
                            allowfullscreen
                            allowtransparency
                            allow="autoplay; encrypted-media; picture-in-picture; web-share; fullscreen; screen-orientation"
                        ></iframe>
                    </div>
                </div>

                ${mostrarSelector ? `<div class="episode-selector">${botonesHtml}</div>` : ''}

                <div class="expediente-info">
                    <h3>📁 Sobre este expediente</h3>
                    <p>${v.desc}</p>
                    <div class="expediente-tags">
                        ${v.tags.map(t => `<span class="exp-tag">${t}</span>`).join('')}
                    </div>
                </div>
            `;

            document.title = v.title + titleSuffix + " — Frame Perdido";

            // ============================================================
            // INICIAR PLYR
            // ============================================================
            if (document.getElementById('player')) {
                const player = new Plyr('#player', {
                    youtube: {
                        noCookie: false,
                        rel: 0,
                        modestbranding: 1,
                        iv_load_policy: 3
                    },
                    tooltips: { controls: true, seek: true },
                    keyboard: { focused: true, global: true },
                    fullscreen: {
                        enabled: true,
                        fallback: true,
                        iosNative: true
                    },
                    controls: [
                        'play-large',
                        'play',
                        'progress',
                        'current-time',
                        'mute',
                        'volume',
                        'captions',
                        'settings',
                        'pip',
                        'fullscreen'
                    ],
                    settings: ['captions', 'quality', 'speed'],
                    quality: {
                        default: 720,
                        options: [1080, 720, 480, 360]
                    }
                });
            }

        } else {
            // ============================================================
            // ERROR: CONTENIDO NO DISPONIBLE
            // ============================================================
            app.innerHTML = `
                <div class="error-box">
                    <h2>🔒 Contenido no disponible</h2>
                    <p>Este expediente aún no tiene video en nuestro archivo.</p>
                    <span class="id-received">ID: ${id || 'ninguno'}</span>
                    <a href="index.html" class="back-btn" style="margin-top:20px;display:inline-block;">← Volver al catálogo</a>
                </div>
            `;
            document.title = "No disponible — Frame Perdido";
        }

        // ============================================================
        // FUNCIÓN PARA CAMBIAR DE EPISODIO
        // ============================================================
        function cambiarEpisodio(id, num, version) {
            let url = `watch.html?id=${id}&ep=${num}`;
            if (version) {
                url += `&version=${version}`;
            }
            window.location.href = url;
        }
    </script>
</body>
</html>
