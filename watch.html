    <style>

            .adsterra-mobile { display: block; }
            .adsterra-desktop { display: none; }
        }

        /* ============================================================
           VARIABLES Y RESET
           ============================================================ */
        :root {
            --bg: #0a0a0f;
            --bg-card: #12121a;
            --bg-elevated: #1a1a25;
            --text: #e8e8f0;
            --text-muted: #8a8a9a;
            --text-dim: #5a5a6a;
            --accent: #ff6b35;
            --accent-soft: #ff6b3520;
            --accent-glow: #ff6b3560;
            --border: #2a2a3a;
            --border-hover: #3a3a50;
            --plyr-color-main: #ff6b35;
            --plyr-video-control-color: #e8e8f0;
            --plyr-video-control-color-hover: #ffffff;
            --plyr-video-control-background-hover: rgba(255,107,53,0.2);
            --plyr-range-fill-background: #ff6b35;
            --plyr-range-thumb-background: #ff6b35;
            --plyr-range-thumb-shadow: 0 0 10px rgba(255,107,53,0.5);
            --plyr-menu-background: #12121a;
            --plyr-menu-color: #e8e8f0;
            --plyr-tooltip-background: #1a1a25;
            --plyr-tooltip-color: #e8e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-page {
            max-width: 1100px;
            width: 100%;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .video-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .video-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: opacity 0.3s;
        }
        .back-btn:hover { opacity: 0.7; }

        .plyr-container {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .plyr--video {
            border-radius: 16px;
        }
        .plyr--video .plyr__controls {
            padding: 16px 20px;
        }
        .plyr--fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
        }

        .episode-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .episode-btn {
            padding: 5px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .episode-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .episode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .version-separator {
            color: var(--text-muted);
            padding: 0 10px;
            font-size: 0.9rem;
            opacity: 0.4;
            user-select: none;
        }

        .expediente-info {
            margin-top: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        .expediente-info h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .expediente-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .expediente-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .exp-tag {
            background: #1a1a25;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
        }

        .error-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 480px;
            margin: 0 auto;
        }
        .error-box h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }
        .error-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .error-box .id-received {
            display: inline-block;
            background: #1a1a25;
            border: 1px solid var(--border);
            color: #5a5a6a;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'Space Grotesk', monospace;
            margin: 12px 0;
        }

        @media (max-width: 768px) {
            .video-title { font-size: 1.1rem; }
            body { padding: 10px; }
            .plyr-container { border-radius: 12px; }
            .expediente-info { padding: 16px; }
        }
        @media (orientation: portrait) {
            .plyr--fullscreen video {
                transform: rotate(0deg) !important;
            }
        }
    </style>
</head>

            if (!url) return '';

                if (url.includes('?')) {
