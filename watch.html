        }

            padding: 16px 20px;
        }
        .plyr--fullscreen {

            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
        }

        .episode-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .episode-btn {
            padding: 5px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .episode-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .episode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .version-separator {
            color: var(--text-muted);
            padding: 0 10px;
            font-size: 0.9rem;
            opacity: 0.4;
            user-select: none;
        }

        .expediente-info {
            margin-top: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        .expediente-info h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .expediente-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .expediente-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .exp-tag {
            background: #1a1a25;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid var(--border);

            background: var(--bg-card);

            text-align: center;
            max-width: 480px;

        .error-box h2 {

            font-size: 1.3rem;

        .error-box p {
            color: var(--text-muted);

        const params = new URLSearchParams(window.location.search);

        function esVideoMega(url) {
            return url && url.includes('mega.nz/embed');
        }

        function esVideoYouTube(url) {
            return url && (url.includes('youtube.com/embed') || url.includes('youtu.be'));
        }

        function obtenerUrlClean(url) {
            if (!url) return '';
            if (esVideoMega(url)) return url;
            if (esVideoYouTube(url)) {
                let cleanUrl = url;
                if (url.includes('?')) cleanUrl = url.split('?')[0];
                return cleanUrl + '?rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&origin=' + encodeURIComponent(window.location.origin);
            }
            return url;
        }

            // Actualizar selector de episodios
            const agrupados = {};
            episodios.forEach(e => {
                if (!agrupados[e.num]) agrupados[e.num] = [];
                agrupados[e.num].push(e);
            });

            let botonesHtml = '';
            Object.keys(agrupados).forEach(num => {
                const grupo = agrupados[num];
                const versionesHtml = grupo.map(e => {
                    const isActive = (e.num === episodioActual.num && e.version === episodioActual.version);
                    const activeClass = isActive ? 'active' : '';
                    const label = e.version ? `${e.version}${e.num}` : `Ep. ${e.num}`;
                    return `<button class="episode-btn ${activeClass}" onclick="cambiarEpisodio(${id}, ${e.num}, '${e.version}')">${label}</button>`;
                }).join('');
                if (botonesHtml) botonesHtml += ' <span class="version-separator">|</span> ';
                botonesHtml += versionesHtml;
            });

            document.getElementById('episodeSelector').innerHTML = botonesHtml;

            // Actualizar info
            document.getElementById('expedienteDesc').textContent = v.desc;
            document.getElementById('expedienteTags').innerHTML = v.tags.map(t => `<span class="exp-tag">${t}</span>`).join('');

            // Iniciar Plyr
            if (document.getElementById('player')) {
                const player = new Plyr('#player', {
                    youtube: { noCookie: false, rel: 0, modestbranding: 1, iv_load_policy: 3 },
                    tooltips: { controls: true, seek: true },
                    keyboard: { focused: true, global: true },
                    fullscreen: { enabled: true, fallback: true, iosNative: true },
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
                    settings: ['captions', 'quality', 'speed'],
                    quality: { default: 720, options: [1080, 720, 480, 360] }
                });
            }

        } else {
            // Error
            document.getElementById('videoTitle').textContent = 'Contenido no disponible';
            document.getElementById('episodeSelector').innerHTML = '';
            document.getElementById('expedienteDesc').textContent = 'Este expediente aún no tiene video en nuestro archivo.';
            document.getElementById('expedienteTags').innerHTML = `<span class="exp-tag">ID: ${id || 'ninguno'}</span>`;
            document.title = "No disponible — Frame Perdido";
        }
    </script>
