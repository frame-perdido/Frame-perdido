    <style>
        :root {
            --bg: #0a0a0f; --bg-card: #12121a; --bg-elevated: #1a1a25;
            --text: #e8e8f0; --text-muted: #8a8a9a; --text-dim: #5a5a6a;
            --accent: #ff6b35; --accent-soft: #ff6b3520; --accent-glow: #ff6b3560;
            --border: #2a2a3a; --border-hover: #3a3a50;
            --plyr-color-main: #ff6b35;
            --plyr-video-control-color: #e8e8f0;

            --plyr-range-thumb-background: #ff6b35;

            --plyr-menu-color: #e8e8f0;
            --plyr-tooltip-background: #1a1a25;
            --plyr-tooltip-color: #e8e8f0;

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .action-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 16px 0 20px 0; flex-wrap: wrap; }
        .action-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 30px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; transition: all 0.3s ease; text-decoration: none; color: #fff; }
        .action-btn.support { background: #2a2a3a; border: 1px solid #3a3a50; }
        .action-btn.support:hover { background: #3a3a50; border-color: #ff6b35; transform: translateY(-2px); }

        .back-btn:hover { opacity: 0.7; }

        .plyr-container { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.5); aspect-ratio: 16/9; background: #000; }
        .plyr-container iframe { width: 100%; height: 100%; border: 0; display: block; }
        .plyr--video { border-radius: 16px; }
        .plyr--video .plyr__controls { padding: 16px 20px; }

        .video-overlay-blocker-bottom { position: absolute; bottom: 0; right: 0; width: 220px; height: 70px; background: transparent; z-index: 2147483646; pointer-events: auto; cursor: default; }

        .episode-selector { display: flex; flex-direction: column; gap: 6px; margin: 16px 0; }
        .episode-btn { padding: 5px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-family: 'Inter', sans-serif; transition: all 0.3s; }
        .episode-btn:hover { border-color: var(--accent); color: var(--text); }
        .episode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .version-group { margin: 4px 0; width: 100%; }
        .version-btn { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; width: 100%; text-align: left; transition: all 0.3s; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 8px; }
        .version-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
        .version-btn .count { color: var(--text-muted); font-weight: 400; font-size: 0.75rem; margin-left: auto; }
        .episode-list { display: none; flex-wrap: wrap; gap: 6px; padding: 8px 0 8px 16px; border-left: 2px solid var(--border); margin: 4px 0 8px 8px; }
        .episode-list.open { display: flex; }
        @media (max-width: 480px) {
            .episode-list .episode-btn { font-size: 0.7rem; padding: 4px 10px; }
            .version-btn { font-size: 0.8rem; padding: 8px 12px; }
        }

        .expediente-info { margin-top: 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
        .expediente-info h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; color: var(--accent); margin-bottom: 12px; }
        .expediente-info p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; }
        .expediente-tags { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .exp-tag { background: #1a1a25; color: var(--text-muted); padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; border: 1px solid var(--border); }

        @media (max-width: 768px) {
            .video-title { font-size: 1.1rem; }
            body { padding: 10px; }
            .plyr-container { border-radius: 12px; }
            .expediente-info { padding: 16px; }
        }
        @media (orientation: portrait) { .plyr--fullscreen video { transform: rotate(0deg) !important; } }

        @media (min-width: 1400px) {
            .ad-skyscraper { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); width: 160px; height: 600px; z-index: 50; border-radius: 4px; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border); }
            body { padding-right: 180px; }
        }
        @media (max-width: 1399px) {
            .ad-skyscraper { display: none !important; }
            body { padding-right: 0 !important; }
        }
    </style>

    <script>
        const videos = {}; // se rellena desde data.js / data-02.js / watch-02-data.js
        let videos2 = null; // por si tu data-02.js lo define

        // --- helper: clave slug de la API a partir del título ---
        function slugify(s) {
            return String(s || "").toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        }

        // --- helper: transformar un objeto de la API a tu formato videos{} ---
        function apiToLocal(apiSerie, apiCaps) {
            const eps = (apiCaps || []).map(c => ({
                num: c.capitulo,
                version: c.tituloTemporada || (c.temporada > 1 ? `T${c.temporada}` : ""),
                url: c.video,
                _titulo: c.titulo,
                _temporada: c.temporada,
                _duracion: c.duracion
            }));
            return {
                title: apiSerie.titulo,
                year: apiSerie.fecha,
                studio: "",
                director: "",
                desc: apiSerie.descripcion || "Sin descripción disponible.",
                tags: [apiSerie.tipo || "serie", `${apiSerie.numCapitulosDisponibles || 0} caps`],
                episodios: eps
            };
        }
    </script>

    <!-- Cargar tus data locales (si existen) -->

    <script src="data-02.js" onerror="console.warn('data-02.js no encontrado')"></script>
    <script>
        if (typeof videos2 !== 'undefined' && videos2) {
            Object.assign(videos, videos2);
        }

    <!-- ============================================================ -->
    <!-- LÓGICA PRINCIPAL -->
    <!-- ============================================================ -->
    <script>
    (async function () {
        const API = "https://frik-api.onrender.com";
        const params = new URLSearchParams(window.location.search);
        const idParam = params.get('id');
        const serieSlug = params.get('serie');
        const ep = parseInt(params.get('ep')) || 1;
        const version = params.get('version') || null;

        const videoFrame = document.getElementById('videoFrame');
        const videoTitle = document.getElementById('videoTitle');
        const videoMeta = document.getElementById('videoMeta');
        const episodeSelector = document.getElementById('episodeSelector');
        const expedienteDesc = document.getElementById('expedienteDesc');
        const expedienteTags = document.getElementById('expedienteTags');

        videoFrame.addEventListener("contextmenu", e => e.preventDefault());
        videoFrame.addEventListener("dragstart", e => e.preventDefault());

        // =====================================================
        // RUTA A: carga desde data.js local (id numérico)
        // =====================================================
        function cargarLocal(id) {
            const v = videos[id];
            if (!v) return false;

            const episodios = v.episodios || [];
            let actual = null;
            if (episodios.length) {
                actual = episodios.find(e => e.num === ep && (version ? e.version === version : true)) || episodios[0];
            }

            let suffix = '';
            if (actual) {
                if (actual.version && actual.version !== "Episodio") suffix = ` — ${actual.version} ${actual.num}`;
                else if (episodios.length > 1) suffix = ` — Episodio ${actual.num}`;
            }
            document.title = v.title + suffix + " — Frame Perdido";
            videoTitle.textContent = v.title + suffix;
            videoMeta.textContent = `${v.year || ""} · ${v.studio || ""} · ${v.director || ""}`;

            if (actual && actual.url) {
                videoFrame.src = actual.url;
            }

            renderSelectorLocal(episodios, id);

            expedienteDesc.textContent = v.desc || "Sin descripción.";
            expedienteTags.innerHTML = (v.tags || []).map(t => `<span class="exp-tag">${t}</span>`).join('');
            return true;
        }

        function renderSelectorLocal(episodios, id) {
            if (!episodios.length) {
                episodeSelector.innerHTML = `<p style="color:var(--text-muted);font-size:0.85rem;">No hay episodios disponibles.</p>`;
                return;
            }
            const grupos = {};
            episodios.forEach(e => {
                const k = e.version || "Episodio";
                (grupos[k] = grupos[k] || []).push(e);
            });
            const keys = Object.keys(grupos);
            if (keys.length === 1 && keys[0] === "Episodio") {
                episodeSelector.innerHTML = episodios.map(e =>
                    `<button class="episode-btn ${e.num === ep ? 'active' : ''}" onclick="cambiarLocal(${id},${e.num},'')">Ep. ${e.num}</button>`
                ).join('');
                return;
            }
            episodeSelector.innerHTML = keys.map(k => {
                const gid = 'g-' + id + '-' + k.replace(/\s/g, '-');
                return `<div class="version-group">
                    <button class="version-btn" onclick="toggleVersion('${gid}')">📁 ${k}<span class="count">${grupos[k].length}</span></button>
                    <div class="episode-list" id="${gid}">
                        ${grupos[k].map(e => `<button class="episode-btn ${e.num === ep && e.version === k ? 'active' : ''}" onclick="cambiarLocal(${id},${e.num},'${(e.version||'').replace(/'/g,"\\'")}')">Ep. ${e.num}</button>`).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        window.cambiarLocal = function (id, num, ver) {
            let url = `watch.html?id=${id}&ep=${num}`;
            if (ver) url += `&version=${encodeURIComponent(ver)}`;
            window.location.href = url;
        };

        window.toggleVersion = function (gid) {
            const list = document.getElementById(gid);
            if (!list) return;
            list.classList.toggle('open');
        };

        // =====================================================
        // RUTA B: carga desde la API (slug)
        // =====================================================
        async function cargarDesdeAPI(slug) {
            videoTitle.textContent = "Cargando...";
            videoMeta.textContent = "";
            try {
                const [rS, rC] = await Promise.all([
                    fetch(`${API}/serie/${encodeURIComponent(slug)}`),
                    fetch(`${API}/serie/${encodeURIComponent(slug)}/capitulos?limit=500`)
                ]);
                if (!rS.ok) throw new Error(`Serie "${slug}" no encontrada (${rS.status})`);
                const serie = await rS.json();
                const caps = rC.ok ? (await rC.json()).items || [] : [];

                document.title = `${serie.titulo} — Frame Perdido`;
                videoTitle.textContent = serie.titulo;
                videoMeta.textContent = [
                    serie.fecha,
                    serie.tipo,
                    `${caps.length} caps disponibles`
                ].filter(Boolean).join(' · ');

                // Elegir capítulo
                let cap = caps.find(c => c.capitulo === ep && (version ? c.temporada === parseInt(version) : true)) || caps[0];
                if (cap) {
                    videoFrame.src = cap.video;
                    videoMeta.textContent += ` · T${cap.temporada}E${cap.capitulo}${cap.titulo ? ' — ' + cap.titulo : ''}`;
                }

                // Agrupar por temporada
                const porTemp = {};
                caps.forEach(c => (porTemp[c.temporada] = porTemp[c.temporada] || []).push(c));

                episodeSelector.innerHTML = Object.keys(porTemp).sort((a,b)=>a-b).map(t => {
                    const gid = `t-${serie.slug}-${t}`;
                    const isOpen = cap && cap.temporada === parseInt(t);
                    return `<div class="version-group">
                        <button class="version-btn" onclick="toggleVersion('${gid}')">📁 Temporada ${t}<span class="count">${porTemp[t].length}</span></button>
                        <div class="episode-list ${isOpen ? 'open' : ''}" id="${gid}">
                            ${porTemp[t].sort((a,b)=>a.capitulo-b.capitulo).map(c =>
                                `<button class="episode-btn ${cap && c.capitulo === cap.capitulo && c.temporada === cap.temporada ? 'active' : ''}"
                                        onclick="cambiarAPI('${serie.slug}',${c.temporada},${c.capitulo})"
                                        title="${(c.titulo||'').replace(/"/g,'&quot;')}">
                                    ${c.capitulo}
                                </button>`
                            ).join('')}
                        </div>
                    </div>`;
                }).join('') || `<p style="color:var(--text-muted);font-size:0.85rem;">No hay capítulos disponibles.</p>`;

                expedienteDesc.textContent = serie.descripcion || "Sin descripción disponible.";
                expedienteTags.innerHTML = [
                    serie.fecha ? `<span class="exp-tag">📅 ${serie.fecha}</span>` : '',
                    serie.tipo ? `<span class="exp-tag">🏷️ ${serie.tipo}</span>` : '',
                    serie.numCapitulosDisponibles ? `<span class="exp-tag">🎬 ${serie.numCapitulosDisponibles} capítulos</span>` : ''
                ].filter(Boolean).join('');

            } catch (err) {
                console.error(err);
                videoTitle.textContent = "Contenido no disponible";
                expedienteDesc.textContent = `Error: ${err.message}`;
            }
        }

        window.cambiarAPI = function (slug, temporada, capitulo) {
            window.location.href = `watch.html?serie=${encodeURIComponent(slug)}&ep=${capitulo}&version=${temporada}`;
        };

        // =====================================================
        // ROUTER: ¿local o API?
        // =====================================================
        if (serieSlug) {
            // Viene con ?serie=slug → usa la API
            await cargarDesdeAPI(serieSlug);
        } else if (idParam) {
            const id = parseInt(idParam);
            // Intenta primero local
            if (!cargarLocal(id)) {
                // Fallback: busca en la API por título (no hay slug en la URL)
                try {
                    const nombre = (videos[id] && videos[id].title) || null;
                    if (nombre) {
                        const r = await fetch(`${API}/buscar?q=${encodeURIComponent(nombre)}&limit=1`);
                        const d = await r.json();
                        if (d.items && d.items.length) {
                            await cargarDesdeAPI(d.items[0].slug);
                            return;
                        }
                    }
                } catch (e) { console.warn(e); }

                videoTitle.textContent = "Contenido no disponible";
                expedienteDesc.textContent = "Este expediente no existe en el archivo.";
                expedienteTags.innerHTML = `<span class="exp-tag">ID: ${id}</span>`;
            }
        } else {
            videoTitle.textContent = "Falta parámetro en la URL";
            expedienteDesc.textContent = "Usa ?id=123 (local) o ?serie=slug (API).";
            expedienteTags.innerHTML = `<span class="exp-tag">Ejemplo: ?serie=doraemon</span>`;
        }
    })();
    </script>
