<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series — Frame Perdido</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg:#0a0a0f;
    --bg-card:#12121a;
    --bg-elevated:#1a1a25;
    --bg-hover:#222230;
    --text:#e8e8f0;
    --text-muted:#8a8a9a;
    --text-dim:#5a5a6a;
    --accent:#d4a373;
    --accent-soft:#d4a37320;
    --accent-glow:#d4a37360;
    --border:#2a2420;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}

.wrap {
    max-width:1200px;
    margin:0 auto;
}

header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:22px;
}

.logo {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
}

.logo-icon {
    width:30px;
    height:30px;
    background:var(--accent);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#fff;
    font-family:'Space Mono',monospace;
    font-size:.8rem;
}

.logo-text {
    font-family:'Space Mono',monospace;
    font-size:.95rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text);
}

.logo-text span {
    color:var(--accent);
}

h1 {
    font-family:'Space Mono',monospace;
    font-size:1.8rem;
    margin-bottom:6px;
}

.subtitle {
    color:var(--text-muted);
    font-size:.85rem;
    margin-bottom:20px;
    font-family:'Space Mono',monospace;
}

/* BUSCADOR */

.search-box {
    position:relative;
    max-width:560px;
    margin:0 auto 24px;
}

.search-box input {
    width:100%;
    padding:14px 48px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-size:.9rem;
    font-family:'Space Mono',monospace;
    outline:none;
}

.search-box input:focus {
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
}

.search-icon {
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-dim);
}

.search-clear {
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:0;
    color:var(--text-muted);
    cursor:pointer;
    display:none;
}

.search-clear.visible {
    display:block;
}

.results-info {
    text-align:center;
    color:var(--text-muted);
    font-size:.75rem;
    font-family:'Space Mono',monospace;
    margin-bottom:16px;
}

/* FILTROS */

.filters {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:20px;
    justify-content:center;
}

.filter-btn {
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:6px 14px;
    border-radius:4px;
    cursor:pointer;
    font-size:.7rem;
    font-family:'Space Mono',monospace;
}

.filter-btn:hover,
.filter-btn.active {
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
}

/* GRID */

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:14px;
}

.card {
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
}

.card:hover {
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 0 24px var(--accent-glow);
}

.card-img {
    position:relative;
    aspect-ratio:2/3;
    overflow:hidden;
    background:var(--bg-elevated);
}

.card-img img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.4s;
}

.card:hover .card-img img {
    transform:scale(1.06);
}

.card-img-empty {
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-family:'Space Mono',monospace;
    font-size:.75rem;
}

.card-year {
    position:absolute;
    top:8px;
    left:8px;
    background:rgba(0,0,0,.75);
    color:#fff;
    padding:3px 8px;
    border-radius:4px;
    font-size:.65rem;
    font-family:'Space Mono',monospace;
}

.card-type {
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.7);
    color:var(--accent);
    padding:3px 8px;
    border-radius:4px;
    font-size:.6rem;
    font-family:'Space Mono',monospace;
}

.card-body {
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.card-title {
    font-family:'Space Mono',monospace;
    font-size:.85rem;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.card-caps {
    color:var(--text-muted);
    font-size:.7rem;
    font-family:'Space Mono',monospace;
}

.card-caps.has {
    color:var(--accent);
}

/* ESTADOS */

.loading,
.error,
.empty {
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
    font-family:'Space Mono',monospace;
    font-size:.85rem;
}

.error {
    color:#ef4444;
}

.load-more {
    display:block;
    margin:30px auto;
    padding:12px 30px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text-muted);
    border-radius:4px;
    cursor:pointer;
    font-family:'Space Mono',monospace;
}

@media(max-width:768px) {
    body {
        padding:12px;
    }

    h1 {
        font-size:1.4rem;
    }

    .grid {
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .card-body {
        padding:8px;
    }

    .card-title {
        font-size:.7rem;
    }
}
</style>
</head>

<body>

<div class="wrap">

<header>
    <a href="index.html" class="logo">
        <div class="logo-icon">FP</div>
        <div class="logo-text">
            Frame <span>Perdido</span>
        </div>
    </a>
</header>

<h1>🎬 Series</h1>

<p class="subtitle">
    &gt; <span id="totalInfo">Cargando...</span>
</p>

<div class="search-box">

    <span class="search-icon">$</span>

    <input
        type="text"
        id="searchInput"
        placeholder="Buscar serie..."
        autocomplete="off"
    >

    <button
        class="search-clear"
        id="clearBtn"
    >
        ✕
    </button>

</div>

<div class="filters">

    <button
        class="filter-btn active"
        data-decada="all"
    >
        Todas
    </button>

    <button
        class="filter-btn"
        data-decada="1960"
    >
        60s
    </button>

    <button
        class="filter-btn"
        data-decada="1970"
    >
        70s
    </button>

    <button
        class="filter-btn"
        data-decada="1980"
    >
        80s
    </button>

    <button
        class="filter-btn"
        data-decada="1990"
    >
        90s
    </button>

    <button
        class="filter-btn"
        data-decada="2000"
    >
        2000s
    </button>

    <button
        class="filter-btn"
        data-decada="2010"
    >
        2010s
    </button>

    <button
        class="filter-btn"
        id="capsBtn"
    >
        Con capítulos
    </button>

</div>

<div
    class="results-info"
    id="resultsInfo"
></div>

<div
    id="grid"
    class="grid"
></div>

<div id="status">
    <div class="loading">
        &gt; Cargando series...
    </div>
</div>

</div>


<script>

const API = "https://frik-api.onrender.com";

const POR_PAGINA = 60;

let todas = [];
let filtradas = [];

let pagina = 1;
let decadaActiva = "all";
let soloConCaps = false;

let buscando = false;

const $ = selector =>
    document.querySelector(selector);


function esc(value) {

    return String(value ?? "")
        .replace(/[&<>"']/g, c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c]));

}


/* =====================================================
   CARGAR SERIES
===================================================== */

async function cargarSeries() {

    try {

        const respuesta = await fetch(
            `${API}/series?page=1&limit=200`
        );

        if (!respuesta.ok) {
            throw new Error(
                `HTTP ${respuesta.status}`
            );
        }

        const datos =
            await respuesta.json();

        todas =
            datos.items || [];

        filtradas =
            [...todas];

        $("#totalInfo").textContent =
            `${datos.total || todas.length} series en el archivo`;

        render();

    } catch(error) {

        console.error(error);

        $("#status").innerHTML = `
            <div class="error">
                ✕ ${esc(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   BUSCAR DIRECTAMENTE EN LA API
===================================================== */

let timerBusqueda = null;

async function buscarAPI(texto) {

    const q =
        texto.trim();

    if (q.length < 2) {

        buscando = false;

        aplicarFiltrosLocales();

        return;

    }

    buscando = true;

    $("#status").innerHTML = `
        <div class="loading">
            &gt; Buscando "${esc(q)}"...
        </div>
    `;

    $("#grid").innerHTML = "";

    try {

        const respuesta = await fetch(
            `${API}/buscar?q=${encodeURIComponent(q)}&tipo=serie&limit=100`
        );

        if (!respuesta.ok) {

            throw new Error(
                `HTTP ${respuesta.status}`
            );

        }

        const datos =
            await respuesta.json();

        filtradas =
            datos.items || [];

        $("#resultsInfo").textContent =
            `${datos.total || filtradas.length} resultado${filtradas.length === 1 ? "" : "s"} para "${q}"`;

        render();

    } catch(error) {

        console.error(error);

        $("#grid").innerHTML = "";

        $("#status").innerHTML = `
            <div class="error">
                ✕ ${esc(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   FILTROS LOCALES
===================================================== */

function aplicarFiltrosLocales() {

    const q =
        $("#searchInput")
            .value
            .toLowerCase()
            .trim();

    filtradas =
        todas.filter(s => {

            if (q) {

                const titulo =
                    (s.titulo || "")
                    .toLowerCase();

                const descripcion =
                    (s.descripcion || "")
                    .toLowerCase();

                if (
                    !titulo.includes(q) &&
                    !descripcion.includes(q)
                ) {
                    return false;
                }

            }

            if (
                decadaActiva !== "all"
            ) {

                const inicio =
                    Number(decadaActiva);

                const fecha =
                    Number(s.fecha);

                if (
                    !fecha ||
                    fecha < inicio ||
                    fecha >= inicio + 10
                ) {
                    return false;
                }

            }

            if (soloConCaps) {

                if (
                    Number(
                        s.numCapitulosDisponibles
                    ) <= 0
                ) {
                    return false;
                }

            }

            return true;

        });

    $("#resultsInfo").textContent =
        `${filtradas.length} series`;

    render();

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const grid =
        $("#grid");

    grid.innerHTML = "";

    if (!filtradas.length) {

        $("#status").innerHTML = `
            <div class="empty">
                📭 No se encontraron series
            </div>
        `;

        return;

    }

    const limite =
        Math.min(
            POR_PAGINA,
            filtradas.length
        );

    for (
        let i = 0;
        i < limite;
        i++
    ) {

        grid.appendChild(
            crearCard(
                filtradas[i]
            )
        );

    }

    if (
        filtradas.length > limite
    ) {

        $("#status").innerHTML = `
            <button
                class="load-more"
                id="loadMore"
            >
                Cargar más
            </button>
        `;

        $("#loadMore")
            .addEventListener(
                "click",
                () => cargarMas()
            );

    } else {

        $("#status").innerHTML = "";

    }

}


/* =====================================================
   CARGAR MÁS
===================================================== */

let visibles = POR_PAGINA;

function cargarMas() {

    const grid =
        $("#grid");

    const nuevoFin =
        Math.min(
            visibles + POR_PAGINA,
            filtradas.length
        );

    for (
        let i = visibles;
        i < nuevoFin;
        i++
    ) {

        grid.appendChild(
            crearCard(
                filtradas[i]
            )
        );

    }

    visibles =
        nuevoFin;

    if (
        visibles >=
        filtradas.length
    ) {

        $("#status").innerHTML = "";

    } else {

        $("#status").innerHTML = `
            <button
                class="load-more"
                id="loadMore"
            >
                Cargar más
            </button>
        `;

        $("#loadMore")
            .addEventListener(
                "click",
                cargarMas
            );

    }

}


/* =====================================================
   CREAR FICHA
===================================================== */

function crearCard(s) {

    const a =
        document.createElement("a");

    a.className = "card";

    /*
     * AQUÍ está el enlace automático.
     *
     * No hay ningún slug escrito manualmente.
     */

    a.href =
        `expediente.html?serie=${encodeURIComponent(s.slug)}`;


    const tieneCaps =
        Number(
            s.numCapitulosDisponibles
        ) > 0;


    let imagen;

    if (s.imagen) {

        imagen = `
            <img
                src="${esc(s.imagen)}"
                alt="${esc(s.titulo)}"
                loading="lazy"
                onerror="
                    this.style.display='none';
                    this.parentElement
                        .querySelector('.card-img-empty')
                        .style.display='flex';
                "
            >
            <div
                class="card-img-empty"
                style="display:none"
            >
                🎬 Sin portada
            </div>
        `;

    } else {

        imagen = `
            <div class="card-img-empty">
                🎬 Sin portada
            </div>
        `;

    }


    a.innerHTML = `

        <div class="card-img">

            ${imagen}

            ${
                s.fecha
                ? `
                    <span class="card-year">
                        ${esc(s.fecha)}
                    </span>
                `
                : ""
            }

            <span class="card-type">
                ${esc(s.tipo || "serie")}
            </span>

        </div>


        <div class="card-body">

            <div class="card-title">
                ${esc(s.titulo)}
            </div>

            <div
                class="card-caps ${tieneCaps ? "has" : ""}"
            >
                ${
                    tieneCaps
                    ? `✅ ${s.numCapitulosDisponibles} caps`
                    : "📭 Sin caps"
                }
            </div>

        </div>

    `;

    return a;

}


/* =====================================================
   BUSCADOR
===================================================== */

$("#searchInput")
.addEventListener(
    "input",
    () => {

        const valor =
            $("#searchInput").value;

        $("#clearBtn")
            .classList
            .toggle(
                "visible",
                valor.length > 0
            );


        clearTimeout(
            timerBusqueda
        );


        timerBusqueda =
            setTimeout(
                () => {

                    if (
                        valor.trim().length >= 2
                    ) {

                        buscarAPI(
                            valor
                        );

                    } else {

                        buscando = false;

                        aplicarFiltrosLocales();

                    }

                },
                350
            );

    }
);


/* =====================================================
   LIMPIAR BUSCADOR
===================================================== */

$("#clearBtn")
.addEventListener(
    "click",
    () => {

        $("#searchInput").value = "";

        $("#clearBtn")
            .classList
            .remove("visible");

        buscando = false;

        aplicarFiltrosLocales();

    }
);


/* =====================================================
   FILTROS
===================================================== */

document
.querySelectorAll(
    ".filter-btn[data-decada]"
)
.forEach(btn => {

    btn.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(
                b =>
                    b.classList
                    .remove("active")
            );


            btn.classList.add(
                "active"
            );


            decadaActiva =
                btn.dataset.decada;

            soloConCaps = false;

            aplicarFiltrosLocales();

        }
    );

});


/* =====================================================
   CON CAPÍTULOS
===================================================== */

$("#capsBtn")
.addEventListener(
    "click",
    () => {

        soloConCaps =
            !soloConCaps;

        $("#capsBtn")
            .classList
            .toggle(
                "active",
                soloConCaps
            );


        document
        .querySelectorAll(
            ".filter-btn[data-decada]"
        )
        .forEach(
            b =>
                b.classList
                .remove("active")
        );


        if (!soloConCaps) {

            document
            .querySelector(
                '[data-decada="all"]'
            )
            .classList
            .add("active");

        }


        aplicarFiltrosLocales();

    }
);


/* =====================================================
   INICIAR
===================================================== */

cargarSeries();

</script>

</body>
</html>
