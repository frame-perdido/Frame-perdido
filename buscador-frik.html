<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expediente — Frame Perdido</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root {
    --bg:#0a0a0f;
    --bg-card:#12121a;
    --bg-elevated:#1a1a25;
    --bg-hover:#222230;

    --text:#e8e8f0;
    --text-muted:#8a8a9a;
    --text-dim:#5a5a6a;

    --accent:#d4a373;
    --accent-soft:#d4a37320;
    --accent-glow:#d4a37360;

    --border:#2a2420;
    --border-hover:#3a322c;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;

    background-image:
        radial-gradient(
            ellipse at 30% 20%,
            rgba(139,69,19,0.06) 0%,
            transparent 60%
        ),
        radial-gradient(
            ellipse at 70% 80%,
            rgba(139,69,19,0.04) 0%,
            transparent 60%
        );
}

.wrap {
    max-width:1100px;
    margin:0 auto;
}

/* HEADER */

header {
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding-bottom:14px;
    margin-bottom:25px;

    border-bottom:1px solid var(--border);
}

.logo {
    display:flex;
    align-items:center;
    gap:8px;

    text-decoration:none;
    color:inherit;
}

.logo-icon {
    width:30px;
    height:30px;

    background:var(--accent);

    border-radius:4px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Space Mono',monospace;
    font-size:.8rem;
    font-weight:700;

    color:#fff;

    box-shadow:0 0 20px var(--accent-glow);
}

.logo-text {
    font-family:'Space Mono',monospace;
    font-size:.95rem;
    letter-spacing:1px;
    text-transform:uppercase;
}

.logo-text span {
    color:var(--accent);
}

.back {
    color:var(--text-muted);
    text-decoration:none;

    font-family:'Space Mono',monospace;
    font-size:.7rem;

    padding:7px 10px;

    border:1px solid var(--border);
    border-radius:4px;

    transition:.2s;
}

.back:hover {
    color:var(--accent);
    border-color:var(--accent);
}


/* ESTADOS */

.loading,
.error,
.empty {
    text-align:center;
    padding:70px 20px;

    font-family:'Space Mono',monospace;
    font-size:.85rem;

    color:var(--text-muted);
}

.error {
    color:#ef4444;
}


/* FICHA */

.ficha {
    display:grid;

    grid-template-columns:220px 1fr;

    gap:25px;

    margin-bottom:35px;
}

.poster {
    width:100%;

    aspect-ratio:2/3;

    background:var(--bg-elevated);

    border:1px solid var(--border);

    border-radius:6px;

    overflow:hidden;
}

.poster img {
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.poster-empty {
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--text-dim);

    font-family:'Space Mono',monospace;
    font-size:.7rem;
}

.ficha-info h1 {
    font-family:'Space Mono',monospace;

    font-size:1.7rem;

    line-height:1.3;

    margin-bottom:10px;
}

.meta {
    display:flex;
    flex-wrap:wrap;

    gap:7px;

    margin-bottom:18px;
}

.meta span {
    border:1px solid var(--border);

    background:var(--bg-card);

    color:var(--text-muted);

    padding:5px 9px;

    border-radius:4px;

    font-family:'Space Mono',monospace;

    font-size:.65rem;
}

.meta span.accent {
    color:var(--accent);
    border-color:var(--accent-glow);
}

.descripcion {
    color:var(--text-muted);

    font-size:.85rem;

    line-height:1.7;

    max-width:750px;
}


/* TEMPORADAS */

.seccion-titulo {
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:15px;

    border-bottom:1px solid var(--border);

    padding-bottom:10px;
}

.seccion-titulo h2 {
    font-family:'Space Mono',monospace;

    font-size:1rem;
}

.seccion-titulo span {
    color:var(--text-dim);

    font-family:'Space Mono',monospace;

    font-size:.65rem;
}


/* TEMPORADA */

.temporada {
    margin-bottom:22px;
}

.temporada-header {
    display:flex;

    align-items:center;
    justify-content:space-between;

    background:var(--bg-card);

    border:1px solid var(--border);

    padding:12px 14px;

    cursor:pointer;

    transition:.2s;
}

.temporada-header:hover {
    border-color:var(--border-hover);
}

.temporada-header h3 {
    font-family:'Space Mono',monospace;

    font-size:.8rem;
}

.temporada-header span {
    color:var(--text-muted);

    font-family:'Space Mono',monospace;

    font-size:.65rem;
}

.temporada-arrow {
    color:var(--accent);

    margin-right:8px;

    transition:.2s;
}

.temporada.open .temporada-arrow {
    transform:rotate(90deg);
}


/* EPISODIOS */

.episodios {
    display:none;

    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));

    gap:8px;

    padding-top:8px;
}

.temporada.open .episodios {
    display:grid;
}

.episodio {
    background:var(--bg-card);

    border:1px solid var(--border);

    border-radius:4px;

    padding:11px;

    cursor:pointer;

    transition:.2s;
}

.episodio:hover {
    background:var(--bg-hover);

    border-color:var(--accent);

    transform:translateY(-2px);
}

.ep-num {
    color:var(--accent);

    font-family:'Space Mono',monospace;

    font-size:.65rem;

    margin-bottom:5px;
}

.ep-title {
    font-size:.75rem;

    line-height:1.35;

    color:var(--text);
}

.ep-extra {
    margin-top:6px;

    color:var(--text-dim);

    font-family:'Space Mono',monospace;

    font-size:.58rem;
}


/* REPRODUCTOR */

.player-section {
    display:none;

    margin-top:35px;

    border-top:1px solid var(--border);

    padding-top:25px;
}

.player-section.visible {
    display:block;
}

.player-title {
    font-family:'Space Mono',monospace;

    font-size:.9rem;

    margin-bottom:12px;
}

.player-box {
    width:100%;

    aspect-ratio:16/9;

    background:#000;

    border:1px solid var(--border);

    border-radius:6px;

    overflow:hidden;
}

.player-box iframe {
    width:100%;
    height:100%;

    border:0;
}

.player-loading {
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--text-muted);

    font-family:'Space Mono',monospace;

    font-size:.75rem;
}

.close-player {
    margin-top:10px;

    background:transparent;

    border:1px solid var(--border);

    color:var(--text-muted);

    padding:7px 12px;

    border-radius:4px;

    cursor:pointer;

    font-family:'Space Mono',monospace;

    font-size:.65rem;
}

.close-player:hover {
    border-color:var(--accent);
    color:var(--accent);
}


/* RESPONSIVE */

@media(max-width:700px) {

    body {
        padding:12px;
    }

    .ficha {
        grid-template-columns:120px 1fr;

        gap:15px;
    }

    .ficha-info h1 {
        font-size:1.05rem;
    }

    .descripcion {
        font-size:.75rem;
        line-height:1.55;
    }

    .meta {
        gap:4px;
        margin-bottom:10px;
    }

    .meta span {
        font-size:.55rem;
        padding:4px 6px;
    }

    .episodios {
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="wrap">

<header>

    <a href="index.html" class="logo">
        <div class="logo-icon">FP</div>

        <div class="logo-text">
            Frame <span>Perdido</span>
        </div>
    </a>

    <a href="series.html" class="back">
        ← SERIES
    </a>

</header>


<div id="contenido">

    <div class="loading">
        &gt; Cargando expediente...
    </div>

</div>


</div>


<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const API = "https://frik-api.onrender.com";


/* =========================================================
   UTILIDADES
   ========================================================= */

const $ = selector =>
    document.querySelector(selector);


function esc(valor) {

    return String(valor ?? "")
        .replace(/[&<>"']/g, caracter => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[caracter]));

}


/*
    Obtiene un valor intentando varios nombres posibles.

    Esto permite que la página tolere pequeñas diferencias
    en los nombres de los campos de la API.
*/

function campo(obj, nombres, defecto = "") {

    for (const nombre of nombres) {

        if (
            obj &&
            obj[nombre] !== undefined &&
            obj[nombre] !== null
        ) {
            return obj[nombre];
        }

    }

    return defecto;
}


/* =========================================================
   SLUG DE LA URL
   ========================================================= */

const parametros = new URLSearchParams(
    window.location.search
);

const slug = parametros.get("serie");


if (!slug) {

    $("#contenido").innerHTML = `
        <div class="error">
            ✕ No se recibió ninguna serie.
        </div>
    `;

} else {

    cargarExpediente(slug);

}


/* =========================================================
   PETICIÓN JSON
   ========================================================= */

async function pedir(url) {

    const respuesta = await fetch(url);

    if (!respuesta.ok) {

        throw new Error(
            `HTTP ${respuesta.status}`
        );

    }

    return await respuesta.json();

}


/* =========================================================
   CARGAR FICHA
   ========================================================= */

async function cargarExpediente(slug) {

    try {

        /*
            1. Pedimos la ficha
        */

        const ficha = await pedir(
            `${API}/serie/${encodeURIComponent(slug)}`
        );


        /*
            Algunas APIs devuelven:

            {
                "serie": {...}
            }

            y otras directamente:

            {
                "titulo": ...
            }

            Por eso comprobamos ambas.
        */

        const serie =
            ficha.serie ||
            ficha.data ||
            ficha;


        /*
            2. Pedimos TODOS los capítulos

            La API ya tiene el endpoint para esto.
        */

        const capitulosRespuesta =
            await pedir(
                `${API}/serie/${encodeURIComponent(slug)}/capitulos`
            );


        /*
            Puede devolver directamente un array
            o un objeto con "items", "capitulos" o "data".
        */

        let capitulos =
            Array.isArray(capitulosRespuesta)
                ? capitulosRespuesta
                : (
                    capitulosRespuesta.capitulos ||
                    capitulosRespuesta.items ||
                    capitulosRespuesta.data ||
                    []
                );


        mostrarFicha(
            serie,
            capitulos
        );


    } catch (error) {

        console.error(error);

        $("#contenido").innerHTML = `
            <div class="error">
                ✕ No se pudo cargar la serie.<br><br>
                <small>${esc(error.message)}</small>
            </div>
        `;

    }

}


/* =========================================================
   MOSTRAR FICHA + CAPÍTULOS
   ========================================================= */

function mostrarFicha(serie, capitulos) {

    const titulo =
        campo(
            serie,
            ["titulo","title","nombre"],
            "Sin título"
        );


    const imagen =
        campo(
            serie,
            ["imagen","poster","portada","imagen_url","poster_url"],
            ""
        );


    const fecha =
        campo(
            serie,
            ["fecha","anio","año","year"],
            ""
        );


    const tipo =
        campo(
            serie,
            ["tipo","type"],
            "serie"
        );


    const descripcion =
        campo(
            serie,
            ["descripcion","description","sinopsis"],
            ""
        );


    document.title =
        `${titulo} — Frame Perdido`;


    const posterHTML = imagen

        ? `
            <img
                src="${esc(imagen)}"
                alt="${esc(titulo)}"
                onerror="
                    this.parentElement.innerHTML =
                    '<div class=\\'poster-empty\\'>🎬 Sin portada</div>'
                "
            >
          `

        : `
            <div class="poster-empty">
                🎬 Sin portada
            </div>
          `;


    $("#contenido").innerHTML = `

        <section class="ficha">

            <div class="poster">
                ${posterHTML}
            </div>


            <div class="ficha-info">

                <h1>
                    ${esc(titulo)}
                </h1>


                <div class="meta">

                    ${
                        fecha
                        ? `<span>${esc(fecha)}</span>`
                        : ""
                    }

                    <span class="accent">
                        ${esc(tipo)}
                    </span>

                    <span>
                        ${capitulos.length}
                        capítulo${capitulos.length !== 1 ? "s" : ""}
                    </span>

                </div>


                ${
                    descripcion
                    ? `
                        <div class="descripcion">
                            ${esc(descripcion)}
                        </div>
                      `
                    : ""
                }

            </div>

        </section>


        <section>

            <div class="seccion-titulo">

                <h2>
                    CAPÍTULOS
                </h2>

                <span>
                    ${capitulos.length} disponibles
                </span>

            </div>


            <div id="temporadas"></div>

        </section>


        <section
            id="playerSection"
            class="player-section"
        >

            <div
                id="playerTitle"
                class="player-title"
            ></div>


            <div
                id="playerBox"
                class="player-box"
            ></div>


            <button
                id="closePlayer"
                class="close-player"
            >
                CERRAR REPRODUCTOR
            </button>

        </section>

    `;


    $("#closePlayer").addEventListener(
        "click",
        cerrarPlayer
    );


    construirTemporadas(capitulos);

}


/* =========================================================
   AGRUPAR CAPÍTULOS POR TEMPORADA
   ========================================================= */

function construirTemporadas(capitulos) {

    const grupos = {};


    capitulos.forEach((capitulo, indice) => {

        /*
            Intentamos diferentes nombres posibles
            para temporada.
        */

        const temporada =
            campo(
                capitulo,
                [
                    "temporada",
                    "season",
                    "temporada_num",
                    "season_number"
                ],
                1
            );


        const numero =
            campo(
                capitulo,
                [
                    "capitulo",
                    "episodio",
                    "episode",
                    "numero",
                    "number",
                    "episode_number"
                ],
                indice + 1
            );


        /*
            Guardamos el número normalizado.
        */

        const clave =
            String(temporada);


        if (!grupos[clave]) {
            grupos[clave] = [];
        }


        grupos[clave].push({
            ...capitulo,
            _temporada: temporada,
            _numero: numero
        });

    });


    const contenedor =
        $("#temporadas");


    const temporadas =
        Object.keys(grupos).sort(
            (a,b) =>
                Number(a) - Number(b)
        );


    if (!temporadas.length) {

        contenedor.innerHTML = `
            <div class="empty">
                📭 Esta serie no tiene capítulos disponibles.
            </div>
        `;

        return;

    }


    temporadas.forEach(
        (temporadaNumero, indice) => {

            const lista =
                grupos[temporadaNumero];


            lista.sort(
                (a,b) =>
                    Number(a._numero) -
                    Number(b._numero)
            );


            const bloque =
                document.createElement("div");


            bloque.className =
                "temporada";


            /*
                La primera temporada queda abierta.
            */

            if (indice === 0) {
                bloque.classList.add("open");
            }


            bloque.innerHTML = `

                <div class="temporada-header">

                    <h3>
                        <span class="temporada-arrow">
                            ▶
                        </span>

                        Temporada ${esc(temporadaNumero)}
                    </h3>

                    <span>
                        ${lista.length}
                        episodio${lista.length !== 1 ? "s" : ""}
                    </span>

                </div>


                <div class="episodios"></div>

            `;


            const listaDOM =
                bloque.querySelector(
                    ".episodios"
                );


            lista.forEach(
                capitulo => {

                    listaDOM.appendChild(
                        crearEpisodio(capitulo)
                    );

                }
            );


            bloque
                .querySelector(".temporada-header")
                .addEventListener(
                    "click",
                    () => {

                        bloque.classList.toggle(
                            "open"
                        );

                    }
                );


            contenedor.appendChild(
                bloque
            );

        }
    );

}


/* =========================================================
   CREAR EPISODIO
   ========================================================= */

function crearEpisodio(capitulo) {

    const elemento =
        document.createElement("div");


    elemento.className =
        "episodio";


    const numero =
        capitulo._numero;


    const titulo =
        campo(
            capitulo,
            [
                "titulo",
                "title",
                "nombre",
                "titulo_capitulo",
                "episode_title"
            ],
            `Episodio ${numero}`
        );


    const idioma =
        campo(
            capitulo,
            [
                "idioma",
                "language",
                "audio"
            ],
            ""
        );


    elemento.innerHTML = `

        <div class="ep-num">
            EPISODIO ${esc(numero)}
        </div>

        <div class="ep-title">
            ${esc(titulo)}
        </div>

        ${
            idioma
            ? `
                <div class="ep-extra">
                    ${esc(idioma)}
                </div>
              `
            : ""
        }

    `;


    elemento.addEventListener(
        "click",
        () => {

            reproducirCapitulo(
                slug,
                capitulo._temporada,
                capitulo._numero,
                titulo
            );

        }
    );


    return elemento;

}


/* =========================================================
   PEDIR CAPÍTULO ESPECÍFICO
   =============================
