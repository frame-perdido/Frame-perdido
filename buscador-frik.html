<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expediente — Frame Perdido</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root {
    --bg:#0a0a0f;
    --bg-card:#12121a;
    --bg-elevated:#1a1a25;
    --bg-hover:#222230;
    --text:#e8e8f0;
    --text-muted:#8a8a9a;
    --text-dim:#5a5a6a;
    --accent:#d4a373;
    --accent-soft:#d4a37320;
    --accent-glow:#d4a37360;
    --border:#2a2420;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}

.wrap {
    max-width:1100px;
    margin:0 auto;
}

header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:25px;
}

.logo {
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text);
}

.logo-icon {
    width:30px;
    height:30px;
    background:var(--accent);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:'Space Mono',monospace;
    font-size:.8rem;
    font-weight:700;
    box-shadow:0 0 20px var(--accent-glow);
}

.logo-text {
    font-family:'Space Mono',monospace;
    font-size:.95rem;
    letter-spacing:1px;
    text-transform:uppercase;
}

.logo-text span {
    color:var(--accent);
}

.back {
    color:var(--text-muted);
    text-decoration:none;
    font-family:'Space Mono',monospace;
    font-size:.7rem;
    border:1px solid var(--border);
    padding:7px 10px;
    border-radius:4px;
}

.back:hover {
    color:var(--accent);
    border-color:var(--accent);
}


/* FICHA */

.ficha {
    display:grid;
    grid-template-columns:220px 1fr;
    gap:25px;
    margin-bottom:35px;
}

.poster {
    aspect-ratio:2/3;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
}

.poster img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.poster-empty {
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-family:'Space Mono',monospace;
    font-size:.7rem;
}

.ficha-info h1 {
    font-family:'Space Mono',monospace;
    font-size:1.7rem;
    line-height:1.3;
    margin-bottom:12px;
}

.meta {
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:18px;
}

.meta span {
    padding:5px 9px;
    border:1px solid var(--border);
    background:var(--bg-card);
    border-radius:4px;
    color:var(--text-muted);
    font-family:'Space Mono',monospace;
    font-size:.65rem;
}

.meta .accent {
    color:var(--accent);
    border-color:var(--accent);
}

.descripcion {
    max-width:750px;
    color:var(--text-muted);
    font-size:.85rem;
    line-height:1.7;
}


/* SECCIÓN */

.section-title {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
}

.section-title h2 {
    font-family:'Space Mono',monospace;
    font-size:.9rem;
}

.section-title span {
    color:var(--text-dim);
    font-family:'Space Mono',monospace;
    font-size:.65rem;
}


/* TEMPORADAS */

.temporada {
    margin-bottom:8px;
}

.temporada-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px;
    background:var(--bg-card);
    border:1px solid var(--border);
    cursor:pointer;
    border-radius:4px;
}

.temporada-header:hover {
    border-color:var(--accent);
}

.temporada-header h3 {
    font-family:'Space Mono',monospace;
    font-size:.75rem;
}

.temporada-header span {
    color:var(--text-muted);
    font-family:'Space Mono',monospace;
    font-size:.6rem;
}

.arrow {
    display:inline-block;
    color:var(--accent);
    margin-right:7px;
    transition:.2s;
}

.temporada.open .arrow {
    transform:rotate(90deg);
}


/* EPISODIOS */

.episodios {
    display:none;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:8px;
    padding-top:8px;
}

.temporada.open .episodios {
    display:grid;
}

.episodio {
    padding:12px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:4px;
    cursor:pointer;
    transition:.2s;
}

.episodio:hover {
    background:var(--bg-hover);
    border-color:var(--accent);
    transform:translateY(-2px);
}

.ep-num {
    color:var(--accent);
    font-family:'Space Mono',monospace;
    font-size:.6rem;
    margin-bottom:6px;
}

.ep-title {
    font-size:.75rem;
    line-height:1.4;
}


/* PLAYER */

#player {
    display:none;
    margin-top:35px;
    padding-top:25px;
    border-top:1px solid var(--border);
}

#player.visible {
    display:block;
}

.player-title {
    font-family:'Space Mono',monospace;
    font-size:.8rem;
    margin-bottom:12px;
}

.player-box {
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
}

.player-box iframe {
    width:100%;
    height:100%;
    border:0;
}

.close {
    margin-top:10px;
    padding:7px 12px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    font-family:'Space Mono',monospace;
    font-size:.6rem;
    cursor:pointer;
}


/* ESTADOS */

.loading,
.error,
.empty {
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
    font-family:'Space Mono',monospace;
    font-size:.8rem;
}

.error {
    color:#ef4444;
}


/* MOBILE */

@media(max-width:700px) {

    body {
        padding:12px;
    }

    .ficha {
        grid-template-columns:120px 1fr;
        gap:15px;
    }

    .ficha-info h1 {
        font-size:1rem;
    }

    .descripcion {
        font-size:.72rem;
    }

    .episodios {
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="wrap">

<header>

<a href="index.html" class="logo">

<div class="logo-icon">
FP
</div>

<div class="logo-text">
Frame <span>Perdido</span>
</div>

</a>

<a href="series.html" class="back">
← SERIES
</a>

</header>


<div id="contenido">

<div class="loading">
&gt; Cargando expediente...
</div>

</div>


</div>


<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const API = "https://frik-api.onrender.com";


/* =========================================================
   SLUG DE LA URL
   ========================================================= */

const params = new URLSearchParams(
    window.location.search
);

const slug = params.get("serie");


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function esc(valor) {

    return String(valor ?? "")
        .replace(/[&<>"']/g, c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c]));

}


/* =========================================================
   PETICIÓN API
   ========================================================= */

async function pedir(url) {

    console.log("API:", url);

    const respuesta = await fetch(url);

    if (!respuesta.ok) {

        throw new Error(
            `HTTP ${respuesta.status}`
        );

    }

    return await respuesta.json();

}


/* =========================================================
   INICIO
   ========================================================= */

async function iniciar() {

    if (!slug) {

        mostrarError(
            "No se recibió el slug de la serie."
        );

        return;
    }


    try {

        /*
         * 1. FICHA
         */

        const serie = await pedir(
            `${API}/serie/${encodeURIComponent(slug)}`
        );


        /*
         * 2. CAPÍTULOS
         *
         * La API devuelve:
         *
         * {
         *   slug,
         *   titulo,
         *   total,
         *   page,
         *   limit,
         *   items:[...]
         * }
         */

        const datosCaps = await pedir(
            `${API}/serie/${encodeURIComponent(slug)}/capitulos?limit=500`
        );


        const capitulos =
            datosCaps.items || [];


        mostrarFicha(
            serie,
            capitulos
        );


    } catch (error) {

        console.error(error);

        mostrarError(
            `No se pudo cargar la serie: ${error.message}`
        );

    }

}


/* =========================================================
   MOSTRAR ERROR
   ========================================================= */

function mostrarError(mensaje) {

    document.getElementById("contenido").innerHTML = `

        <div class="error">

            ✕ ${esc(mensaje)}

            <br><br>

            <a
                href="series.html"
                style="color:var(--accent)"
            >
                ← Volver a series
            </a>

        </div>

    `;

}


/* =========================================================
   FICHA
   ========================================================= */

function mostrarFicha(
    serie,
    capitulos
) {

    const titulo =
        serie.titulo || "Sin título";

    const imagen =
        serie.imagen || "";

    const fecha =
        serie.fecha || "";

    const tipo =
        serie.tipo || "serie";

    const descripcion =
        serie.descripcion || "";


    document.title =
        `${titulo} — Frame Perdido`;


    document.getElementById(
        "contenido"
    ).innerHTML = `

        <section class="ficha">

            <div class="poster">

                ${
                    imagen

                    ? `
                        <img
                            src="${esc(imagen)}"
                            alt="${esc(titulo)}"
                        >
                    `

                    : `
                        <div class="poster-empty">
                            🎬 Sin portada
                        </div>
                    `
                }

            </div>


            <div class="ficha-info">

                <h1>
                    ${esc(titulo)}
                </h1>


                <div class="meta">

                    ${
                        fecha
                        ? `<span>${esc(fecha)}</span>`
                        : ""
                    }

                    <span class="accent">
                        ${esc(tipo)}
                    </span>

                    <span>
                        ${capitulos.length} capítulos
                    </span>

                </div>


                ${
                    descripcion
                    ? `
                        <div class="descripcion">
                            ${esc(descripcion)}
                        </div>
                    `
                    : ""
                }

            </div>

        </section>


        <section>

            <div class="section-title">

                <h2>
                    EPISODIOS
                </h2>

                <span>
                    ${capitulos.length} disponibles
                </span>

            </div>


            <div id="temporadas"></div>

        </section>


        <section id="player">

            <div
                id="playerTitle"
                class="player-title"
            ></div>


            <div
                id="playerBox"
                class="player-box"
            ></div>


            <button
                class="close"
                onclick="cerrarPlayer()"
            >
                CERRAR REPRODUCTOR
            </button>

        </section>

    `;


    construirTemporadas(
        capitulos
    );

}


/* =========================================================
   AGRUPAR TEMPORADAS
   ========================================================= */

function construirTemporadas(
    capitulos
) {

    const grupos = {};


    for (const cap of capitulos) {

        const temporada =
            Number(cap.temporada);


        if (!grupos[temporada]) {

            grupos[temporada] = [];

        }


        grupos[temporada].push(cap);

    }


    const contenedor =
        document.getElementById(
            "temporadas"
        );


    const temporadas =
        Object.keys(grupos)
            .sort(
                (a,b) =>
                    Number(a) - Number(b)
            );


    if (!temporadas.length) {

        contenedor.innerHTML = `

            <div class="empty">

                📭 No hay capítulos disponibles.

            </div>

        `;

        return;

    }


    temporadas.forEach(
        (numeroTemporada, indice) => {

            const lista =
                grupos[numeroTemporada];


            lista.sort(
                (a,b) =>
                    Number(a.capitulo) -
                    Number(b.capitulo)
            );


            const bloque =
                document.createElement("div");


            bloque.className =
                "temporada";


            /*
             * La primera temporada
             * aparece abierta.
             */

            if (indice === 0) {

                bloque.classList.add("open");

            }


            bloque.innerHTML = `

                <div class="temporada-header">

                    <h3>

                        <span class="arrow">
                            ▶
                        </span>

                        Temporada
                        ${esc(numeroTemporada)}

                    </h3>


                    <span>
                        ${lista.length} episodios
                    </span>

                </div>


                <div class="episodios"></div>

            `;


            const listaElementos =
                bloque.querySelector(
                    ".episodios"
                );


            for (const cap of lista) {

                listaElementos.appendChild(
                    crearEpisodio(cap)
                );

            }


            bloque
                .querySelector(
                    ".temporada-header"
                )
                .addEventListener(
                    "click",
                    () => {

                        bloque.classList.toggle(
                            "open"
                        );

                    }
                );


            contenedor.appendChild(
                bloque
            );

        }
    );

}


/* =========================================================
   CREAR EPISODIO
   ========================================================= */

function crearEpisodio(
    cap
) {

    const elemento =
        document.createElement("div");


    elemento.className =
        "episodio";


    elemento.innerHTML = `

        <div class="ep-num">

            EPISODIO
            ${esc(cap.capitulo)}

        </div>


        <div class="ep-title">

            ${
                esc(
                    cap.titulo ||
                    `Episodio ${cap.capitulo}`
                )
            }

        </div>

    `;


    elemento.addEventListener(
        "click",
        () => {

            abrirCapitulo(
                cap.temporada,
                cap.capitulo,
                cap.titulo ||
                `Episodio ${cap.capitulo}`
            );

        }
    );


    return elemento;

}


/* =========================================================
   ABRIR CAPÍTULO
   ========================================================= */

async function abrirCapitulo(
    temporada,
    capitulo,
    titulo
) {

    const player =
        document.getElementById("player");

    const playerTitle =
        document.getElementById("playerTitle");

    const playerBox =
        document.getElementById("playerBox");


    player.classList.add(
        "visible"
    );


    playerTitle.textContent =
        `▶ Temporada ${temporada} · Episodio ${capitulo} · ${titulo}`;


    playerBox.innerHTML = `

        <div class="loading">
            &gt; Cargando episodio...
        </div>

    `;


    player.scrollIntoView({
        behavior:"smooth"
    });


    try {

        /*
         * Endpoint EXACTO de tu main.py:
         *
         * /capitulo
         * ?serie=...
         * &temporada=...
         * &capitulo=...
         */

        const url =
            `${API}/capitulo` +
            `?serie=${encodeURIComponent(slug)}` +
            `&temporada=${encodeURIComponent(temporada)}` +
            `&capitulo=${encodeURIComponent(capitulo)}`;


        const datos =
            await pedir(url);


        console.log(
            "CAPÍTULO:",
            datos
        );


        /*
         * Tu API devuelve:
         *
         * {
         *   serie,
         *   slug,
         *   ...c
         * }
         *
         * El campo de vídeo está dentro
         * del capítulo.
         *
         * Buscamos los nombres habituales
         * que pueda tener ese objeto.
         */

        const video =
            datos.video ||
            datos.url ||
            datos.embed ||
            datos.video_url ||
            datos.embed_url ||
            "";


        if (!video) {

            playerBox.innerHTML = `

                <div class="error">

                    ✕ Este capítulo no tiene
                    vídeo disponible.

                </div>

            `;

            return;

        }


        /*
         * Mostrar vídeo.
         */

        playerBox.innerHTML = `

            <iframe
                src="${esc(video)}"
                allowfullscreen
                allow="autoplay; fullscreen; picture-in-picture"
                referrerpolicy="no-referrer"
            ></iframe>

        `;


    } catch (error) {

        console.error(error);


        playerBox.innerHTML = `

            <div class="error">

                ✕ Error al cargar el capítulo.

                <br><br>

                ${esc(error.message)}

            </div>

        `;

    }

}


/* =========================================================
   CERRAR PLAYER
   ========================================================= */

function cerrarPlayer() {

    const player =
        document.getElementById("player");

    const playerBox =
        document.getElementById("playerBox");


    playerBox.innerHTML = "";

    player.classList.remove(
        "visible"
    );

}


/* =========================================================
   ARRANCAR
   ========================================================= */

iniciar();

</script>

</body>
</html>
