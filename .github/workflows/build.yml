name: Generar páginas de fichas

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Generar fichas
      run: |
        node build-fichas.js
    
    - name: Commit y push de los archivos generados
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add expediente/ sitemap.xml robots.txt
        git diff --staged --quiet || git commit -m "📄 Generar fichas automáticamente"
        git push
